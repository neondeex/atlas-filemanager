name: Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version present in CHANGELOG.md (does not publish a release)
        required: true
        default: '0.1.5'
      edition:
        description: Edition for all platforms (free for the Store baseline)
        type: choice
        options: [full, free]
        default: free
      platform:
        description: Platforms to package
        type: choice
        options: [both, windows, linux]
        default: both
      windows-binaries-run:
        description: Optional prior candidate run; verifies unchanged app sources and rebuilds only search
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: inputs.platform != 'linux'
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ inputs.version }}
      edition: ${{ inputs.edition }}
      source-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      reuse-run-id: ${{ inputs.windows-binaries-run }}
  linux:
    if: inputs.platform != 'windows'
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ inputs.version }}
      edition: ${{ inputs.edition }}
      source-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
