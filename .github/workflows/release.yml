name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v; must have CHANGELOG.md notes
        required: true
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 scripts/linux_release.py metadata --version "$version"
          prerelease=false
          if [[ "$version" == *-* || "$INPUT_PRERELEASE" == true ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      edition: free
      source-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.metadata.outputs.version }}/atlas-${{ needs.metadata.outputs.version }}-source.zip

  linux:
    needs: metadata
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      source-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.metadata.outputs.version }}/atlas-${{ needs.metadata.outputs.version }}-source.zip

  publish:
    name: Publish verified GitHub release
    runs-on: ubuntu-24.04
    needs: [metadata, windows, linux]
    env:
      ATLAS_VERSION: ${{ needs.metadata.outputs.version }}
      ATLAS_TAG: ${{ needs.metadata.outputs.tag }}
      ATLAS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # Windows updates are distributed through Microsoft Store. Keep Windows
      # installers/MSIX in the workflow for maintainer testing and submission.
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: atlas-source
          path: dist
      - name: Final checksums and release notes
        run: |
          python3 scripts/linux_release.py metadata --version "$ATLAS_VERSION"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_release import write_checksums
          write_checksums(Path('dist'))
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create and publish a draft after all Linux checks pass
        run: |
          flags=()
          if [ "$ATLAS_PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$ATLAS_TAG" --json isDraft > /tmp/atlas-existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          if not json.load(open('/tmp/atlas-existing-release.json'))['isDraft']:
              raise SystemExit('A published release must not be overwritten; use a new version')
          PY
          else
            gh release create "$ATLAS_TAG" --draft --target "$GITHUB_SHA" \
              --title "Atlas $ATLAS_VERSION" --notes-file target/linux-release/release-notes.md "${flags[@]}"
          fi
          gh release upload "$ATLAS_TAG" dist/* --clobber
          gh release edit "$ATLAS_TAG" --draft=false --notes-file target/linux-release/release-notes.md "${flags[@]}"

  repositories:
    needs: [metadata, publish]
    if: ${{ vars.ATLAS_LINUX_REPOSITORIES_ENABLED == 'true' && needs.metadata.outputs.prerelease == 'false' }}
    uses: ./.github/workflows/linux-repositories.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
