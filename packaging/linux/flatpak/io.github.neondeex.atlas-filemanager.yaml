app-id: io.github.neondeex.atlas-filemanager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: atlas

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host

modules:
  - name: atlas
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/atlas /app/bin/atlas
      - install -Dm755 bin/atlas-search-service /app/bin/atlas-search-service
      - install -Dm755 bin/atlas-cloud-extension /app/bin/atlas-cloud-extension
      - install -Dm755 bin/atlas-icon-extension /app/bin/atlas-icon-extension
      - install -Dm644 share/applications/atlas.desktop /app/share/applications/io.github.neondeex.atlas-filemanager.desktop
      - sed -i 's/^Icon=atlas$/Icon=io.github.neondeex.atlas-filemanager/' /app/share/applications/io.github.neondeex.atlas-filemanager.desktop
      - install -Dm644 share/icons/hicolor/512x512/apps/atlas.png /app/share/icons/hicolor/512x512/apps/io.github.neondeex.atlas-filemanager.png
      - install -Dm644 share/metainfo/io.github.neondeex.atlas-filemanager.metainfo.xml /app/share/metainfo/io.github.neondeex.atlas-filemanager.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/neondeex/atlas-filemanager/releases/download/v0.1.6-beta.2/atlas-0.1.6-beta.2-linux-x86_64.tar.gz
        sha256: 9fb4c271da079a767f5fc4c2185aa62655588f35dcf1019fe28223bbfd4ba54a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/neondeex/atlas-filemanager/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/neondeex/atlas-filemanager/releases/download/v" + $version + "/atlas-" + $version + "-linux-x86_64.tar.gz"'
