convert_windows_audio_note: "使用 Windows 轉碼器。MP3/AAC/M4A: 最高支援立體聲；取樣率可能會變更。不保留標籤與封面圖。"
convert_windows_video_note: "使用 Windows H.264/AAC 的漸進式 SDR MP4。採用第一視訊/音訊播放軌，最高立體聲；可能會去交錯。不保留字幕與中繼資料。"
convert_subtitle_note: "保留文字與時間軸；忽略樣式與定位。未標記結尾的 LRC/SAMI: 最後一句對白顯示 5 秒。"
convert_subtitle_linear_note: "LRC/SAMI 要求對白時間不得重疊。LRC 會合併換行符號。樣式會被忽略。"
convert_contacts_note: "匯出常見聯絡人欄位。相片、標籤與自訂屬性仍保留在原始檔案中。"
convert_book_note: "純文字書籍: 略過影像、樣式與章節結構。加密內容無法轉換。"
convert_pcm_note: "8/16/24/32 位元整數 PCM: 保留取樣、聲道與取樣率。中繼資料會被略過。"
convert_flac_note: "自建無損 FLAC: 8/16/24/32 位元整數 PCM，最高支援 8 聲道。保留取樣；略過中繼資料。"
convert_opus_note: "48 kHz 失真音訊；最高支援 8 聲道。不保留標籤與封面圖。"
