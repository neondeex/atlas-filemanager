cmd_sys_guide_title: "功能導覽"
cmd_sys_guide_desc: "按部就班了解 Atlas 的強大功能。"
guide_title: "Atlas 導覽指南"
guide_try: "立即試用"
guide_shortcut: "快速鍵:"
guide_goto_title: "快速尋找任何項目"
guide_goto_lead: "只需輸入名稱中的幾個字元，即可立即前往任何資料夾或檔案，無須逐層點選搜尋。"
guide_goto_s1: "使用下方的快速鍵，或從 Atlas 功能表開啟「前往」。"
guide_goto_s2: "輸入名稱的一部分。字母不一定要相連。"
guide_goto_s3: "使用方向鍵選取搜尋結果，然後按下 Enter 開啟。"
guide_goto_s4: "按下 Esc 即可直接關閉而不執行任何動作。"
guide_goto_tip: "提示: 您也可以直接貼上完整路徑以立即前往。"
guide_commands_title: "完全透過鍵盤掌控一切"
guide_commands_lead: "命令面板列出了 Atlas 的所有操作。若您不確定某項功能在哪裡，請在此處搜尋。"
guide_commands_s1: "使用下方的快速鍵開啟命令面板。"
guide_commands_s2: "輸入您想要的動作: 「網格」、「分割」、「佈景主題」、「隱藏」。"
guide_commands_s3: "按下 Enter 執行該動作。每個命令的快速鍵會顯示在右側。"
guide_commands_s4: "在「設定」中，您可以自訂幾乎所有命令的快速鍵。"
guide_commands_tip: "提示: 這是熟悉 Atlas 最快的方式。不妨瀏覽一次命令清單。"
guide_views_title: "變更檔案檢視外觀"
guide_views_lead: "每個窗格都能依資料夾性質自訂顯示方式: 相片顯示為縮圖，文件顯示為詳細資料清單。"
guide_views_s1: "開啟命令面板並輸入「檢視」。"
guide_views_s2: "選擇「詳細資料」、「清單」、「縮圖」、「欄 (Miller)」或「樹狀目錄」。"
guide_views_s3: "在命令面板中使用「分組方式」依日期、大小、類型等進行分組。"
guide_views_s4: "切換「檢視窗」以在清單旁即時預覽所選取的檔案。"
guide_views_tip: "提示: 每個資料夾皆可各自記住專屬的檢視方式。"
guide_panes_title: "多工作業，同時處理多處位置"
guide_panes_lead: "將視窗分割為多個窗格與分頁，輕鬆比較資料夾或在兩者之間移動檔案。"
guide_panes_s1: "從命令面板執行「水平分割」或「垂直分割」。"
guide_panes_s2: "在各個窗格中開啟資料夾。按一下窗格即可切換焦點。"
guide_panes_s3: "將檔案從一個窗格拖曳至另一個窗格以進行複製或移動。"
guide_panes_s4: "在窗格內使用多分頁，將更多常用資料夾保持在手邊。"
guide_panes_tip: "提示: 關閉某個窗格後，其他窗格會自動填滿空間。"
guide_convert_title: "將檔案轉換為其他格式"
guide_convert_lead: "無需離開 Atlas，即可將影像、音訊、視訊與文件轉換為其他格式。"
guide_convert_s1: "選取一或多個檔案。"
guide_convert_s2: "使用下方快速鍵或從滑鼠右鍵快顯功能表開啟「轉換」。"
guide_convert_s3: "選擇輸出格式與選項。"
guide_convert_s4: "開始轉換。產生的高品質成果將儲存在原始檔案旁。"
guide_convert_tip: "提示: 部分格式需要選用引擎，Atlas 會貼心提示並協助安裝。"
guide_analyze_title: "掌握磁碟空間佔用狀況"
guide_analyze_lead: "找出磁碟機中最大的資料夾與暫存檔案，安全無虞地釋放寶貴儲存空間。"
guide_analyze_s1: "以滑鼠右鍵按一下側邊欄中的磁碟機。"
guide_analyze_s2: "選擇「分析並釋放空間…」。"
guide_analyze_s3: "瀏覽空間圖: 每個區塊的面積代表其實際大小。按兩下即可深入查看。"
guide_analyze_s4: "在刪除任何檔案之前，仔細檢視系統建議清理的暫存檔案清單。"
guide_analyze_tip: "提示: 未經您的檢閱確認前，絕不會刪除任何檔案。"
guide_vault_title: "使用密碼保護私人資料夾"
guide_vault_lead: "鎖定資料夾，未經密碼解密無法讀取其中的內容。"
guide_vault_s1: "以滑鼠右鍵按一下您想要保護的資料夾。"
guide_vault_s2: "選擇「使用密碼保護…」並設定高強度密碼。"
guide_vault_s3: "若要再次開啟，請按右鍵並選擇「解鎖…」。"
guide_vault_s4: "請務必妥善保管密碼: 若密碼遺失，資料夾將完全無法復原。"
guide_vault_tip: "提示: 您可以自由指定哪些設定檔能夠看見受保護的資料夾。"
guide_tags_title: "使用標籤井然有序地整理檔案"
guide_tags_lead: "不受檔案存放位置限制，隨心所欲標記檔案，日後輕鬆集中檢視。"
guide_tags_s1: "在側邊欄開啟「標籤」區段並建立新標籤。"
guide_tags_s2: "選取檔案並開啟標籤選擇器。輸入名稱即可建立或切換標籤。"
guide_tags_s3: "按一下側邊欄中的標籤，即可一次瀏覽套用該標籤的所有檔案。"
guide_tags_s4: "從標籤的滑鼠右鍵功能表進行重新命名或刪除。"
guide_tags_tip: "提示: 一個檔案可以同時套用多個標籤。"
guide_cloud_title: "流暢整合雲端硬碟"
guide_cloud_lead: "如同瀏覽本機資料夾般，輕鬆檢視、複製雲端服務中的檔案。"
guide_cloud_s1: "在側邊欄開啟「網路」區段。"
guide_cloud_s2: "選擇「新增雲端硬碟」並選取您的雲端服務供應商。"
guide_cloud_s3: "依提示登入授權。完成後該雲端磁碟機將直接顯示於側邊欄。"
guide_cloud_s4: "在雲端與本機電腦之間隨心拖曳檔案。進度將於傳輸列中即時顯示。"
guide_cloud_tip: "提示: 您的帳號憑證全程安全保存在本機電腦上。"
guide_themes_title: "打造專屬於您的 Atlas"
guide_themes_lead: "個別設定檔皆可自訂獨立的佈景主題與檔案圖示風格。"
guide_themes_s1: "使用下方的快速鍵開啟「設定」。"
guide_themes_s2: "挑選心儀的佈景主題。每個設定檔皆保留獨立外觀設定。"
guide_themes_s3: "在命令面板中使用「選取圖示佈景主題…」隨時更換檔案圖示。"
guide_themes_s4: "使用「下載圖示佈景主題…」取得更多精美的圖示套件。"
guide_themes_tip: "提示: 您可以隨時從命令面板重新開啟初次設定精靈: 「快速上手」。"
guide_open_link: "開啟完整功能導覽指南"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "快速預覽 (Quick Look)"
