convert_pdf_ocr_note: "對所有頁面執行 Windows OCR。請檢閱識別的文字；保留分頁符號但不重新建構排版版面配置。需要系統中已安裝 Windows OCR 語言套件。"
convert_word_package_note: "保留 Word 套件的樣式、影像、表格與頁首。建立 DOCX 時會移除巨集與數位簽章。"
convert_first_sheet: "CSV 與 TSV 僅匯出第一個工作表。JSON 包含所有工作表。"
convert_jpeg_note: "JPEG 會以白色填補透明像素。"
convert_webp_note: "原生 WebP 採無失真壓縮；品質設定不適用。"
convert_pdf_text_note: "保留文字但不重新建構版面配置。掃描的 PDF 需要使用 OCR。"
convert_doc_text_note: "匯出文件純文字，不保留樣式或影像。"
convert_data_note: "CSV 與 TSV 必須包含表格；TOML 無法表示空值 (null)。"
