convert_windows_audio_note: "Использует кодеки Windows. MP3/AAC/M4A: до стерео; частота дискретизации может меняться. Теги и обложки исключаются."
convert_windows_video_note: "Прогрессивный SDR MP4 с кодеками Windows H.264/AAC. Первые дорожки видео/аудио, до стерео; устранение чересстрочности. Без субтитров и метаданных."
convert_subtitle_note: "Сохраняет текст и тайминг; опускает стили и расположение. LRC/SAMI без явного финала: последняя реплика длится 5 секунд."
convert_subtitle_linear_note: "LRC/SAMI требуют непересекающихся реплик. LRC объединяет переносы строк. Стили опускаются."
convert_contacts_note: "Экспорт стандартных полей контактов. Фотографии, метки и особые свойства остаются в оригинале."
convert_book_note: "Текстовая книга: опускает изображения, стили и структуру глав. Зашифрованное содержимое не конвертируется."
convert_pcm_note: "Целочисленный PCM 8/16/24/32 бит: сохраняет сэмплы, каналы и частоту. Метаданные опускаются."
convert_flac_note: "Встроенный FLAC без потерь: целочисленный PCM 8/16/24/32 бит, до 8 каналов. Сохраняет сэмплы; опускает метаданные."
convert_opus_note: "Аудио с потерями при 48 кГц; до 8 каналов. Теги и обложки исключаются."
