guide_title: "Руководство Atlas"
guide_try: "Попробовать"
guide_shortcut: "Сочетание клавиш:"
guide_goto_title: "Мгновенный поиск файлов и папок"
guide_goto_lead: "Быстрый переход к любой папке или файлу по нескольким буквам имени. Без долгих кликов по каталогам."
guide_goto_s1: "Откройте строку перехода с помощью сочетания клавиш ниже или из меню Atlas."
guide_goto_s2: "Введите часть имени. Буквы не обязательно должны стоять подряд."
guide_goto_s3: "Выберите нужный результат стрелками и нажмите Enter, чтобы открыть его."
guide_goto_s4: "Нажмите Esc, чтобы закрыть строку перехода без действий."
guide_goto_tip: "Совет: можно вставить полный путь, чтобы сразу перейти к нему."
guide_commands_title: "Управление всеми функциями с клавиатуры"
guide_commands_lead: "Палитра команд содержит все действия в Atlas. Если не знаете, где найти нужную функцию, найдите ее здесь."
guide_commands_s1: "Откройте палитру с помощью сочетания клавиш ниже."
guide_commands_s2: "Введите нужное действие: «значки», «разделить», «тема», «скрытые»."
guide_commands_s3: "Нажмите Enter для запуска. Сочетание клавиш каждой команды отображается справа."
guide_commands_s4: "В Параметрах можно настроить сочетания клавиш практически для любой команды."
guide_commands_tip: "Совет: это самый быстрый способ освоить Atlas. Просмотрите список команд хотя бы один раз."
guide_views_title: "Настройка отображения файлов"
guide_views_lead: "Каждая панель может отображать файлы наиболее удобным способом: фотографии в виде эскизов, документы в виде подробного списка."
guide_views_s1: "Откройте палитру команд и введите «Вид»."
guide_views_s2: "Выберите режим: Таблица, Список, Значки, Колонки (Миллер) или Дерево."
guide_views_s3: "Используйте «Группировка» в палитре для группировки по дате, размеру, типу и другим свойствам."
guide_views_s4: "Включите панель предпросмотра, чтобы просматривать выбранный файл рядом со списком."
guide_views_tip: "Совет: каждая папка может запоминать собственный режим отображения."
guide_panes_title: "Работа в нескольких местах одновременно"
guide_panes_lead: "Разделяйте окно на панели и вкладки для сравнения папок и быстрого перемещения файлов между ними."
guide_panes_s1: "Запустите команду «Разделить по горизонтали» или «Разделить по вертикали» из палитры команд."
guide_panes_s2: "Открывайте папки в каждой панели. Щелкните панель, чтобы сделать ее активной."
guide_panes_s3: "Перетаскивайте файлы между панелями для копирования или перемещения."
guide_panes_s4: "Используйте вкладки внутри панели, чтобы держать нужные папки под рукой."
guide_panes_tip: "Совет: при закрытии панели остальные автоматически расширяются на освободившееся место."
guide_convert_title: "Конвертация файлов в другие форматы"
guide_convert_lead: "Преобразуйте изображения, аудио, видео и документы в другие форматы прямо в Atlas."
guide_convert_s1: "Выберите один или несколько файлов."
guide_convert_s2: "Откройте конвертер с помощью сочетания клавиш ниже или через контекстное меню правой кнопки мыши."
guide_convert_s3: "Выберите выходной формат и параметры."
guide_convert_s4: "Запустите конвертацию. Результат сохранится рядом с оригиналом."
guide_convert_tip: "Совет: для некоторых форматов может потребоваться дополнительный движок — Atlas предложит установить его."
guide_analyze_title: "Анализ дискового пространства"
guide_analyze_lead: "Находите самые большие папки и временные файлы на диске и безопасно освобождайте свободное место."
guide_analyze_s1: "Нажмите правой кнопкой мыши на диск в боковой панели."
guide_analyze_s2: "Выберите «Анализ и очистка диска…»."
guide_analyze_s3: "Исследуйте карту: размер каждого блока отражает его объем. Двойной щелчок открывает вложенные папки."
guide_analyze_s4: "Проверьте предложенные временные файлы перед их удалением."
guide_analyze_tip: "Совет: ни один файл не удаляется без вашего предварительного подтверждения."
guide_vault_title: "Защита папок паролем"
guide_vault_lead: "Заблокируйте папку, чтобы ее содержимое было невозможно прочитать без ввода пароля."
guide_vault_s1: "Нажмите правой кнопкой мыши на папку, которую хотите защитить."
guide_vault_s2: "Выберите «Защитить паролем…» и задайте пароль."
guide_vault_s3: "Чтобы снова открыть ее, нажмите правой кнопкой мыши и выберите «Разблокировать…»."
guide_vault_s4: "Надежно сохраните пароль: при его утрате восстановить содержимое папки невозможно."
guide_vault_tip: "Совет: можно выбрать, в каких профилях защищенная папка будет видима."
guide_tags_title: "Организация файлов с помощью меток"
guide_tags_lead: "Метки позволяют помечать файлы независимо от их расположения и быстро находить их вместе."
guide_tags_s1: "В боковой панели откройте раздел «Метки» и создайте новую метку."
guide_tags_s2: "Выберите файлы и откройте выбор меток. Введите имя, чтобы создать или назначить метку."
guide_tags_s3: "Щелкните метку в боковой панели, чтобы увидеть все файлы с этой меткой."
guide_tags_s4: "Метки можно переименовывать или удалять через меню правой кнопки мыши."
guide_tags_tip: "Совет: одному файлу можно назначить несколько разных меток."
guide_cloud_title: "Работа с облачными дисками"
guide_cloud_lead: "Просматривайте и копируйте файлы в облачные хранилища и обратно так же легко, как в обычных папках."
guide_cloud_s1: "В боковой панели перейдите к разделу «Сеть»."
guide_cloud_s2: "Выберите «Подключить диск» и укажите облачного провайдера."
guide_cloud_s3: "Войдите в учетную запись по запросу. Диск появится на боковой панели."
guide_cloud_s4: "Перетаскивайте файлы между облаком и компьютером. Ход передачи отображается в панели задач."
guide_cloud_tip: "Совет: ваши учетные данные хранятся исключительно на этом компьютере."
guide_themes_title: "Персонализация Atlas"
guide_themes_lead: "Настройте тему оформления и значки файлов индивидуально для каждого профиля."
guide_themes_s1: "Откройте Параметры с помощью сочетания клавиш ниже."
guide_themes_s2: "Выберите тему оформления. У каждого профиля свои собственные настройки."
guide_themes_s3: "Используйте «Выбрать тему значков…» в палитре команд для смены значков файлов."
guide_themes_s4: "Используйте «Загрузить тему значков…» для получения дополнительных наборов значков."
guide_themes_tip: "Совет: мастер первоначальной настройки можно открыть в любой момент из палитры команд: «Начало работы»."
guide_open_link: "Открыть полное руководство по возможностям"

