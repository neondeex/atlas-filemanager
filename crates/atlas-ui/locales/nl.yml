guide_convert_tip: "Tip: sommige formaten vereisen een optionele engine, die Atlas aanbiedt te installeren."
guide_analyze_title: "Bekijk wat je schijfruimte inneemt"
guide_analyze_lead: "Vind de grootste mappen en tijdelijke bestanden op een station en maak veilig ruimte vrij."
guide_analyze_s1: "Klik met de rechtermuisknop op een station in de zijbalk."
guide_analyze_s2: "Kies \"Analyseren en ruimte vrijmaken…\"."
guide_analyze_s3: "Verken de kaart: de oppervlakte van elk blok weerspiegelt de grootte. Dubbelklik om dieper te gaan."
guide_analyze_s4: "Controleer de voorgestelde tijdelijke bestanden voordat er iets wordt verwijderd."
guide_analyze_tip: "Tip: er wordt niets verwijderd zonder jouw controle."
guide_vault_title: "Een map beveiligen met een wachtwoord"
guide_vault_lead: "Vergrendel een map zodat de inhoud onleesbaar is zonder het wachtwoord."
guide_vault_s1: "Klik met de rechtermuisknop op de map die je wilt beveiligen."
guide_vault_s2: "Kies \"Beveiligen met wachtwoord…\" en stel een wachtwoord in."
guide_vault_s3: "Om deze weer te openen, klik je met de rechtermuisknop en kies je \"Ontgrendelen…\"."
guide_vault_s4: "Bewaar je wachtwoord goed: als het verloren gaat, kan de map niet worden hersteld."
guide_vault_tip: "Tip: je kunt kiezen welke profielen de beveiligde map mogen zien."
guide_tags_title: "Organiseren met tags"
guide_tags_lead: "Tags labelen bestanden waar ze zich ook bevinden, zodat je ze later samen terugvindt."
guide_tags_s1: "Open in de zijbalk de sectie Tags en maak een tag aan."
guide_tags_s2: "Selecteer bestanden en open de tag-kiezer. Typ een naam om een tag te maken of in/uit te schakelen."
guide_tags_s3: "Klik op een tag in de zijbalk om elk bestand met die tag te zien."
guide_tags_s4: "Hernoem of verwijder een tag via het contextmenu met de rechtermuisknop."
guide_tags_tip: "Tip: een bestand kan meerdere tags hebben."
guide_cloud_title: "Gebruik je cloudstations"
guide_cloud_lead: "Blader door bestanden en kopieer van en naar clouddiensten alsof het gewone mappen zijn."
guide_cloud_s1: "Open in de zijbalk de sectie Netwerk."
guide_cloud_s2: "Kies \"Cloudstation toevoegen\" en kies je provider."
guide_cloud_s3: "Meld je aan wanneer daarom wordt gevraagd. Het station verschijnt vervolgens in de zijbalk."
guide_cloud_s4: "Sleep bestanden tussen de cloud en je computer. De voortgang is zichtbaar in de overdrachtsbalk."
guide_cloud_tip: "Tip: je inloggegevens blijven op deze computer."
guide_themes_title: "Maak Atlas helemaal van jou"
guide_themes_lead: "Pas het thema en de bestandspictogrammen aan, per profiel."
guide_themes_s1: "Open Instellingen met de onderstaande sneltoets."
guide_themes_s2: "Kies een thema. Elk profiel behoudt zijn eigen thema."
guide_themes_s3: "Gebruik \"Pictogramthema selecteren…\" in het opdrachtenpalet om bestandspictogrammen te wijzigen."
guide_themes_s4: "Gebruik \"Pictogramthema downloaden…\" om meer pictogrammensets op te halen."
guide_themes_tip: "Tip: je kunt de installatiewizard op elk moment opnieuw openen via het palet: \"Aan de slag\"."
guide_open_link: "Open de volledige functiegids"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Snelle weergave (Quick Look)"
