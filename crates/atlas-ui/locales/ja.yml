guide_title: "Atlas ガイド"
guide_try: "今すぐ試す"
guide_shortcut: "ショートカット:"
guide_goto_title: "目的の項目をすばやく見つける"
guide_goto_lead: "名前の数文字を入力するだけで、任意のフォルダーやファイルにジャンプできます。フォルダーを何層もクリックする必要はありません。"
guide_goto_s1: "以下のショートカット、または Atlas メニューから [移動] を開きます。"
guide_goto_s2: "名前の一部を入力します。文字は連続していなくても検索できます。"
guide_goto_s3: "方向キーで候補を選択し、Enter キーを押して開きます。"
guide_goto_s4: "何も行わずに閉じるには Esc キーを押します。"
guide_goto_tip: "ヒント: 完全なパスを貼り付けて直接移動することもできます。"
guide_commands_title: "すべての操作をキーボードから実行"
guide_commands_lead: "コマンド パレットには Atlas のすべての操作が一覧表示されます。機能の場所が分からないときは、ここで検索してください。"
guide_commands_s1: "以下のショートカットでコマンド パレットを開きます。"
guide_commands_s2: "目的のキーワードを入力します (例:「グリッド」「分割」「テーマ」「隠しファイル」)。"
guide_commands_s3: "Enter キーを押して実行します。各コマンドのショートカットは右側に表示されます。"
guide_commands_s4: "[設定] では、ほぼすべてのコマンドのショートカットを変更できます。"
guide_commands_tip: "ヒント: コマンド パレットの一覧を一度眺めるのが、Atlas を最も早く習得する方法です。"
guide_views_title: "ファイルの表示形式を変更する"
guide_views_lead: "フォルダーの用途に合わせてペインの表示形式を変更できます。写真はサムネイル、ドキュメントは詳細リストなどの使い分けが可能です。"
guide_views_s1: "コマンド パレットを開き、「表示」または「View」と入力します。"
guide_views_s2: "[詳細]、[一覧]、[サムネイル]、[列 (Miller)]、[ツリー] から選択します。"
guide_views_s3: "パレットの [グループ化] を使用すると、日付、サイズ、種類などでグループ分けできます。"
guide_views_s4: "[インスペクター] を切り替えると、選択したファイルのプレビューをリストの横に表示できます。"
guide_views_tip: "ヒント: フォルダーごとに独自の表示設定を記憶させることができます。"
guide_panes_title: "複数の場所で同時に作業する"
guide_panes_lead: "ウィンドウを分割ビューやタブで分割して、フォルダー間の比較やファイルの移動をスムーズに行えます。"
guide_panes_s1: "コマンド パレットから [左右に分割 (2画面)] または [上下に分割] を実行します。"
guide_panes_s2: "各ペインでフォルダーを開きます。ペインをクリックするとフォーカスが当たります。"
guide_panes_s3: "一方のペインからもう一方へファイルをドラッグして、コピーまたは移動します。"
guide_panes_s4: "ペイン内のタブを使えば、さらに多くのフォルダーを手元に保持できます。"
guide_panes_tip: "ヒント: いずれかのペインを閉じると、残りのペインが自動的に広がります。"
guide_convert_title: "ファイルを別の形式に変換する"
guide_convert_lead: "画像、音声、動画、ドキュメントを、Atlas から離れることなく別の形式へ変換できます。"
guide_convert_s1: "1つまたは複数のファイルを選択します。"
guide_convert_s2: "以下のショートカット、または右クリック メニューから [ファイル変換] を開きます。"
guide_convert_s3: "出力形式とオプションを選択します。"
guide_convert_s4: "変換を開始します。変換後のファイルは元のファイルの横に保存されます。"
guide_convert_tip: "ヒント: 一部の形式にはオプションのエンジンが必要です。Atlas から簡単にインストールできます。"
guide_analyze_title: "ディスクの使用状況を確認する"
guide_analyze_lead: "ドライブ内で最も容量を消費しているフォルダーや一時ファイルを検出し、安全に空き領域を増やせます。"
guide_analyze_s1: "サイドバーにあるドライブを右クリックします。"
guide_analyze_s2: "[分析して空き領域を増やす…] を選択します。"
guide_analyze_s3: "マップを確認します。各ブロックの広さがファイル サイズを表します。ダブルクリックで詳細に入れます。"
guide_analyze_s4: "削除が実行される前に、候補として提示された一時ファイルを確認します。"
guide_analyze_tip: "ヒント: 確認なしで勝手にファイルが削除されることは一切ありません。"
guide_vault_title: "パスワードでフォルダーを保護する"
guide_vault_lead: "フォルダーをロックして、パスワードを入力しない限り内容を読み取れないように暗号化保護します。"
guide_vault_s1: "保護したいフォルダーを右クリックします。"
guide_vault_s2: "[パスワードで保護…] を選択し、パスワードを設定します。"
guide_vault_s3: "再度開くには、フォルダーを右クリックして [ロック解除…] を選択します。"
guide_vault_s4: "パスワードは厳重に管理してください。紛失した場合、フォルダーを復元することはできません。"
guide_vault_tip: "ヒント: 保護されたフォルダーを表示できるプロファイルを指定できます。"
guide_tags_title: "タグで整理する"
guide_tags_lead: "ファイルがどのフォルダーにあってもタグを付けることで、後から一括でまとめて見つけることができます。"
guide_tags_s1: "サイドバーの [タグ] セクションを開き、新しいタグを作成します。"
guide_tags_s2: "ファイルを選択してタグ ピッカーを開きます。名前を入力してタグを作成または切り替えます。"
guide_tags_s3: "サイドバーのタグをクリックすると、そのタグが付いたすべてのファイルが表示されます。"
guide_tags_s4: "タグの右クリック メニューから、名前の変更や削除ができます。"
guide_tags_tip: "ヒント: 1つのファイルに複数のタグを付けることができます。"
guide_cloud_title: "クラウド ドライブを活用する"
guide_cloud_lead: "クラウド サービス上のファイルを、通常のローカル フォルダーと同じ感覚で閲覧およびコピーできます。"
guide_cloud_s1: "サイドバーの [ネットワーク] セクションを開きます。"
guide_cloud_s2: "[クラウド ドライブを追加] を選択し、プロバイダーを選びます。"
guide_cloud_s3: "案内が表示されたらサインインします。完了するとサイドバーにドライブが表示されます。"
guide_cloud_s4: "クラウドとコンピューターの間でファイルをドラッグします。進行状況は転送バーに表示されます。"
guide_cloud_tip: "ヒント: ログイン認証情報はすべてこのコンピューター内に安全に保存されます。"
guide_themes_title: "好みに合わせて Atlas をカスタマイズ"
guide_themes_lead: "プロファイルごとにテーマやファイル アイコンを変更して、自分好みの外観に設定できます。"
guide_themes_s1: "以下のショートカットで [設定] を開きます。"
guide_themes_s2: "テーマを選択します。設定はプロファイルごとに個別に保持されます。"
guide_themes_s3: "ファイル アイコンを変更するには、コマンド パレットで「アイコン テーマを選択…」を使用します。"
guide_themes_s4: "「アイコン テーマをダウンロード...」を使用すると、さらに多くのアイコン セットを入手できます。"
guide_themes_tip: "ヒント: パレットで「はじめに」と入力すれば、初回セットアップ画面をいつでも再度開けます。"
guide_open_link: "機能ガイドの全編を開く"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
