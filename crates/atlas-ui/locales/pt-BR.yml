cmd_sys_guide_title: "Guia de recursos"
cmd_sys_guide_desc: "Aprenda o que o Atlas pode fazer, passo a passo."
guide_title: "Guia do Atlas"
guide_try: "Experimente agora"
guide_shortcut: "Atalho:"
guide_goto_title: "Encontre qualquer coisa rapidamente"
guide_goto_lead: "Vá direto a qualquer pasta ou arquivo digitando algumas letras do nome. Sem navegar pasta por pasta."
guide_goto_s1: "Abra o 'Ir para' com o atalho abaixo ou pelo menu do Atlas."
guide_goto_s2: "Digite parte do nome. As letras não precisam estar juntas."
guide_goto_s3: "Use as setas para escolher um resultado e pressione Enter para abrir."
guide_goto_s4: "Pressione Esc para fechar sem fazer nada."
guide_goto_tip: "Dica: você também pode colar um caminho completo para ir direto até ele."
guide_commands_title: "Faça tudo pelo teclado"
guide_commands_lead: "A paleta de comandos lista todas as ações do Atlas. Se não souber onde algo está, pesquise aqui."
guide_commands_s1: "Abra a paleta com o atalho abaixo."
guide_commands_s2: "Digite o que você quer: \"grid\", \"split\", \"theme\", \"hidden\"."
guide_commands_s3: "Pressione Enter para executar. O atalho de cada comando aparece à direita."
guide_commands_s4: "Nas Configurações, você pode alterar o atalho de quase qualquer comando."
guide_commands_tip: "Dica: esta é a maneira mais rápida de aprender o Atlas. Explore a lista pelo menos uma vez."
guide_views_title: "Altere a exibição dos arquivos"
guide_views_lead: "Cada painel pode exibir seus arquivos da maneira mais adequada para a pasta: fotos em miniaturas, documentos em lista detalhada."
guide_views_s1: "Abra a paleta de comandos e digite \"View\" ou \"Exibição\"."
guide_views_s2: "Escolha Detalhes, Lista, Miniaturas, Colunas (Miller) ou Árvore."
guide_views_s3: "Use \"Agrupar por\" na paleta para organizar por data, tamanho, tipo e muito mais."
guide_views_s4: "Ative o Inspetor para pré-visualizar o arquivo selecionado ao lado da lista."
guide_views_tip: "Dica: cada pasta pode lembrar de sua própria exibição."
guide_panes_title: "Trabalhe em vários locais ao mesmo tempo"
guide_panes_lead: "Divida a janela em painéis e abas para comparar pastas ou mover arquivos entre elas."
guide_panes_s1: "Execute \"Dividir Horizontalmente\" ou \"Dividir Verticalmente\" na paleta de comandos."
guide_panes_s2: "Abra pastas em cada painel. Clique em um painel para focar nele."
guide_panes_s3: "Arraste arquivos de um painel para o outro para copiá-los ou movê-los."
guide_panes_s4: "Use abas dentro de um painel para ter mais pastas à mão."
guide_panes_tip: "Dica: ao fechar um painel, os demais se expandem para ocupar o espaço."
guide_convert_title: "Converta um arquivo para outro formato"
guide_convert_lead: "Converta imagens, áudio, vídeo e documentos para outros formatos sem sair do Atlas."
guide_convert_s1: "Selecione um ou mais arquivos."
guide_convert_s2: "Abra Converter com o atalho abaixo ou pelo menu contextual."
guide_convert_s3: "Escolha o formato de saída e as opções desejadas."
guide_convert_s4: "Inicie a conversão. O resultado é salvo ao lado do arquivo original."
guide_convert_tip: "Dica: alguns formatos necessitam de um motor opcional, cuja instalação é oferecida pelo próprio Atlas."
guide_analyze_title: "Veja o que está ocupando seu disco"
guide_analyze_lead: "Encontre as maiores pastas e os arquivos temporários de uma unidade e libere espaço com segurança."
guide_analyze_s1: "Clique com o botão direito em uma unidade na barra lateral."
guide_analyze_s2: "Escolha \"Analisar e liberar espaço…\"."
guide_analyze_s3: "Explore o mapa: a área de cada bloco representa seu tamanho. Clique duplo para entrar."
guide_analyze_s4: "Revise os arquivos temporários sugeridos antes que qualquer item seja excluído."
guide_analyze_tip: "Dica: nada é excluído sem a sua revisão."
guide_vault_title: "Proteja uma pasta com senha"
guide_vault_lead: "Bloqueie uma pasta para que seu conteúdo fique inacessível sem a senha."
guide_vault_s1: "Clique com o botão direito na pasta que deseja proteger."
guide_vault_s2: "Escolha \"Proteger com senha…\" e defina uma senha."
guide_vault_s3: "Para abri-la novamente, clique com o botão direito e escolha \"Desbloquear…\"."
guide_vault_s4: "Guarde bem sua senha: se ela for perdida, a pasta não poderá ser recuperada."
guide_vault_tip: "Dica: você pode escolher quais perfis têm acesso à pasta protegida."
guide_tags_title: "Organize com etiquetas"
guide_tags_lead: "Etiquetas marcam arquivos onde quer que estejam, para que você possa encontrá-los reunidos mais tarde."
guide_tags_s1: "Na barra lateral, abra a seção Etiquetas e crie uma etiqueta."
guide_tags_s2: "Selecione arquivos e abra o seletor de etiquetas. Digite um nome para criar ou alternar uma etiqueta."
guide_tags_s3: "Clique em uma etiqueta na barra lateral para ver todos os arquivos associados a ela."
guide_tags_s4: "Renomeie ou exclua uma etiqueta pelo menu do botão direito."
guide_tags_tip: "Dica: um arquivo pode ter várias etiquetas."
guide_cloud_title: "Use suas unidades na nuvem"
guide_cloud_lead: "Navegue e copie arquivos de e para serviços na nuvem como se fossem pastas locais."
guide_cloud_s1: "Na barra lateral, abra a seção Rede."
guide_cloud_s2: "Escolha \"Adicionar unidade na nuvem\" e selecione seu provedor."
guide_cloud_s3: "Faça login quando solicitado. A unidade aparecerá na barra lateral."
guide_cloud_s4: "Arraste arquivos entre a nuvem e seu computador. O progresso é exibido na barra de transferências."
guide_cloud_tip: "Dica: suas credenciais ficam salvas apenas neste computador."
guide_themes_title: "Deixe o Atlas com a sua cara"
guide_themes_lead: "Altere o tema visual e os ícones de arquivos, de forma independente por perfil."
guide_themes_s1: "Abra as Configurações com o atalho abaixo."
guide_themes_s2: "Escolha um tema. Cada perfil guarda o seu próprio."
guide_themes_s3: "Use \"Selecionar Tema de Ícones…\" na paleta de comandos para alterar os ícones."
guide_themes_s4: "Use \"Baixar Tema de Ícones…\" para obter mais conjuntos de ícones."
