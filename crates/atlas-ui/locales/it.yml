cmd_sys_guide_title: "Guida alle funzionalità"
cmd_sys_guide_desc: "Scopri cosa può fare Atlas, passo dopo passo."
guide_title: "Guida di Atlas"
guide_try: "Prova subito"
guide_shortcut: "Scorciatoia:"
guide_goto_title: "Trova qualsiasi cosa rapidamente"
guide_goto_lead: "Raggiungi qualsiasi cartella o file digitando poche lettere del suo nome. Senza dover navigare tra le cartelle."
guide_goto_s1: "Apri Vai a con la scorciatoia sottostante o dal menu di Atlas."
guide_goto_s2: "Digita una parte del nome. Le lettere non devono essere necessariamente consecutive."
guide_goto_s3: "Usa i tasti freccia per selezionare un risultato e premi Invio per aprirlo."
guide_goto_s4: "Premi Esc per chiudere senza eseguire alcuna azione."
guide_goto_tip: "Suggerimento: puoi anche incollare un percorso completo per andare direttamente alla cartella."
guide_commands_title: "Fai tutto dalla tastiera"
guide_commands_lead: "La tavolozza dei comandi elenca tutte le azioni di Atlas. Se non sai dove si trova qualcosa, cercala qui."
guide_commands_s1: "Apri la tavolozza con la scorciatoia sottostante."
guide_commands_s2: "Digita cosa cerchi: \"griglia\", \"dividi\", \"tema\", \"nascosti\"."
guide_commands_s3: "Premi Invio per eseguire il comando. La scorciatoia di ciascun comando è mostrata a destra."
guide_commands_s4: "In Impostazioni puoi modificare la scorciatoia di quasi tutti i comandi."
guide_commands_tip: "Suggerimento: è il modo più rapido per imparare a usare Atlas. Esplora l'elenco dei comandi."
guide_views_title: "Modifica la visualizzazione dei file"
guide_views_lead: "Ogni riquadro può mostrare i file nella modalità più adatta alla cartella: foto come anteprime, documenti come elenco dettagliato."
guide_views_s1: "Apri la tavolozza dei comandi e digita \"Visualizza\"."
guide_views_s2: "Scegli Dettagli, Elenco, Anteprime, Colonne (Miller) o Struttura ad albero."
guide_views_s3: "Usa \"Raggruppa per\" nella tavolozza per raggruppare per data, dimensione, tipo e altro."
guide_views_s4: "Attiva o disattiva il Riquadro anteprima per visualizzare il file selezionato accanto all'elenco."
guide_views_tip: "Suggerimento: ciascuna cartella può memorizzare la propria visualizzazione."
guide_panes_title: "Lavora in più posizioni contemporaneamente"
guide_panes_lead: "Dividi la finestra in riquadri e schede per confrontare cartelle o spostare file tra di esse."
guide_panes_s1: "Esegui \"Dividi in orizzontale\" o \"Dividi in verticale\" dalla tavolozza dei comandi."
guide_panes_s2: "Apri cartelle in ogni riquadro. Fai clic su un riquadro per attivarlo."
guide_panes_s3: "Trascina i file da un riquadro all'altro per copiarli o spostarli."
guide_panes_s4: "Usa le schede all'interno di un riquadro per tenere più cartelle a portata di mano."
guide_panes_tip: "Suggerimento: chiudendo un riquadro, gli altri si espandono per occupare lo spazio."
guide_convert_title: "Converti un file in un altro formato"
guide_convert_lead: "Converti immagini, audio, video e documenti in altri formati senza uscire da Atlas."
guide_convert_s1: "Seleziona uno o più file."
guide_convert_s2: "Apri Converti con la scorciatoia sottostante o dal menu contestuale."
guide_convert_s3: "Scegli il formato di output e le opzioni."
guide_convert_s4: "Avvia la conversione. Il risultato viene salvato accanto all'originale."
guide_convert_tip: "Suggerimento: alcuni formati richiedono un motore opzionale, che Atlas ti proporrà di installare."
guide_analyze_title: "Scopri cosa occupa spazio sul disco"
guide_analyze_lead: "Individua le cartelle più grandi e i file temporanei su un'unità per liberare spazio in sicurezza."
guide_analyze_s1: "Fai clic con il tasto destro su un'unità nella barra laterale."
guide_analyze_s2: "Scegli \"Analizza e libera spazio…\"."
guide_analyze_s3: "Esplora la mappa: l'area di ogni blocco corrisponde alla sua dimensione. Fai doppio clic per esplorare in profondità."
guide_analyze_s4: "Verifica i file temporanei suggeriti prima di rimuovere qualsiasi elemento."
guide_analyze_tip: "Suggerimento: nessun elemento viene eliminato senza la tua conferma."
guide_vault_title: "Proteggi una cartella con una password"
guide_vault_lead: "Blocca una cartella in modo che i suoi contenuti siano illeggibili senza la password."
guide_vault_s1: "Fai clic con il tasto destro sulla cartella che desideri proteggere."
guide_vault_s2: "Scegli \"Proteggi con password…\" e imposta una password."
guide_vault_s3: "Per aprirla di nuovo, fai clic con il tasto destro e scegli \"Sblocca…\"."
guide_vault_s4: "Conserva la password con cura: in caso di smarrimento, la cartella non potrà essere recuperata."
guide_vault_tip: "Suggerimento: puoi scegliere quali profili possono visualizzare la cartella protetta."
guide_tags_title: "Organizza con i tag"
guide_tags_lead: "I tag contrassegnano i file ovunque si trovino, permettendoti di ritrovarli facilmente."
guide_tags_s1: "Nella barra laterale, apri la sezione Tag e crea un nuovo tag."
guide_tags_s2: "Seleziona i file e apri il selettore dei tag. Digita un nome per creare o assegnare un tag."
guide_tags_s3: "Fai clic su un tag nella barra laterale per visualizzare tutti i file corrispondenti."
guide_tags_s4: "Rinomina o elimina un tag dal relativo menu contestuale."
guide_tags_tip: "Suggerimento: un file può avere più tag."
guide_cloud_title: "Utilizza le tue unità cloud"
guide_cloud_lead: "Esplora e copia file da e verso i servizi cloud come se fossero normali cartelle."
guide_cloud_s1: "Nella barra laterale, apri la sezione Rete."
guide_cloud_s2: "Scegli \"Aggiungi unità cloud\" e seleziona il tuo provider."
guide_cloud_s3: "Accedi quando richiesto. L'unità apparirà nella barra laterale."
guide_cloud_s4: "Trascina i file tra il cloud e il tuo computer. L'avanzamento verrà mostrato nella barra dei trasferimenti."
guide_cloud_tip: "Suggerimento: le tue credenziali rimangono archiviate esclusivamente su questo computer."
guide_themes_title: "Personalizza Atlas"
guide_themes_lead: "Modifica il tema e le icone dei file per ciascun profilo."
guide_themes_s1: "Apri Impostazioni con la scorciatoia sottostante."
guide_themes_s2: "Scegli un tema. Ciascun profilo mantiene il proprio tema."
guide_themes_s3: "Usa \"Seleziona tema icone...\" nella tavolozza dei comandi per cambiare le icone dei file."
guide_themes_s4: "Usa \"Scarica tema icone...\" per scaricare nuovi set di icone."
guide_themes_tip: "Suggerimento: puoi riaprire la configurazione guidata in qualsiasi momento dalla tavolozza: \"Primi passi\"."
guide_open_link: "Apri la guida completa alle funzionalità"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Anteprima rapida (Quick Look)"
