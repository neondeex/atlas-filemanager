convert_windows_audio_note: "Usa i codec di Windows. MP3/AAC/M4A: fino a stereo; la frequenza di campionamento potrebbe variare. I tag e le copertine vengono omessi."
convert_windows_video_note: "MP4 SDR progressivo con H.264/AAC di Windows. Prime tracce audio/video, fino a stereo; possibile deinterlacciamento. Omette sottotitoli e metadati."
convert_subtitle_note: "Mantiene testo e tempi; omette stili e posizionamento. LRC/SAMI senza marcatura di chiusura: l'ultimo cue dura 5 secondi."
convert_subtitle_linear_note: "LRC/SAMI richiedono cue non sovrapposti. LRC unisce le interruzioni di riga. Gli stili vengono omessi."
convert_contacts_note: "Esporta i campi di contatto comuni. Foto, etichette e proprietà personalizzate rimangono nell'originale."
convert_book_note: "Libro basato su testo: omette immagini, stili e struttura dei capitoli. I contenuti protetti da crittografia non vengono convertiti."
convert_pcm_note: "PCM intero a 8/16/24/32 bit: preserva campioni, canali e frequenza. I metadati vengono omessi."
convert_flac_note: "FLAC senza perdita integrato: PCM intero a 8/16/24/32 bit, fino a 8 canali. Preserva i campioni; omette i metadati."
convert_opus_note: "Audio lossy a 48 kHz; fino a 8 canali. Tag e copertine vengono omessi."
