cmd_sys_guide_title: "Özellik rehberi"
cmd_sys_guide_desc: "Atlas'ın neler yapabileceğini adım adım öğrenin."
guide_title: "Atlas rehberi"
guide_try: "Şimdi dene"
guide_shortcut: "Kısayol:"
guide_goto_title: "Her şeyi hızlıca bulun"
guide_goto_lead: "Adının birkaç harfini yazarak herhangi bir klasöre veya dosyaya atlayın. Klasörler arasında tek tek tıklamaya gerek yok."
guide_goto_s1: "Konuma Git özelliğini aşağıdaki kısayolla veya Atlas menüsünden açın."
guide_goto_s2: "Adın bir bölümünü yazın. Harflerin yan yana olması gerekmez."
guide_goto_s3: "Bir sonuç seçmek için yön tuşlarını kullanın ve açmak için Enter tuşuna basın."
guide_goto_s4: "Hiçbir işlem yapmadan kapatmak için Esc tuşuna basın."
guide_goto_tip: "İpucu: Doğrudan oraya gitmek için tam bir yolu da yapıştırabilirsiniz."
guide_commands_title: "Her şeyi klavyeden yapın"
guide_commands_lead: "Komut paleti Atlas'taki her eylemi listeler. Bir şeyin nerede olduğunu bilmiyorsanız buradan arayın."
guide_commands_s1: "Paleti aşağıdaki kısayolla açın."
guide_commands_s2: "İstediğinizi yazın: \"grid\", \"split\", \"theme\", \"hidden\" veya \"ızgara\", \"böl\", \"tema\", \"gizli\"."
guide_commands_s3: "Çalıştırmak için Enter tuşuna basın. Her komutun kısayolu sağ tarafta gösterilir."
guide_commands_s4: "Ayarlar bölümünde neredeyse her komutun kısayolunu değiştirebilirsiniz."
guide_commands_tip: "İpucu: Bu, Atlas'ı öğrenmenin en hızlı yoludur. Listeye bir kez göz atın."
guide_views_title: "Dosyaların nasıl göründüğünü değiştirin"
guide_views_lead: "Her bölme, dosyalarını klasöre en uygun şekilde gösterebilir: fotoğraflar küçük resim olarak, belgeler ayrıntılı liste olarak."
guide_views_s1: "Komut paletini açın ve \"Görünüm\" yazın."
guide_views_s2: "Ayrıntılar, Liste, Küçük Resimler, Sütunlar (Miller) veya Ağaç seçeneklerinden birini belirleyin."
guide_views_s3: "Tarihe, boyuta, türe ve daha fazlasına göre gruplandırmak için palette \"Gruplandırma ölçütü\" seçeneğini kullanın."
guide_views_s4: "Seçilen dosyayı listenin yanında önizlemek için Denetçi'yi açın."
guide_views_tip: "İpucu: Her klasör kendi görünümünü hatırlayabilir."
guide_panes_title: "Aynı anda birden çok yerde çalışın"
guide_panes_lead: "Klasörleri karşılaştırmak veya aralarında dosya taşımak için pencereyi bölmelere ve sekmelere ayırın."
guide_panes_s1: "Komut paletinden \"Yatay Böl\" veya \"Dikey Böl\" komutunu çalıştırın."
guide_panes_s2: "Her bölmede farklı klasörler açın. Odaklanmak için bir bölmeye tıklayın."
guide_panes_s3: "Kopyalamak veya taşımak için dosyaları bir bölmeden diğerine sürükleyin."
guide_panes_s4: "Daha fazla klasörü elinizin altında tutmak için bir bölme içinde sekmeleri kullanın."
guide_panes_tip: "İpucu: Bir bölmeyi kapattığınızda diğerleri boşluğu dolduracak şekilde genişler."
guide_convert_title: "Bir dosyayı başka bir biçime dönüştürün"
guide_convert_lead: "Atlas'tan ayrılmadan resimleri, sesleri, videoları ve belgeleri diğer biçimlere dönüştürün."
guide_convert_s1: "Bir veya daha fazla dosya seçin."
guide_convert_s2: "Aşağıdaki kısayola basın veya komut paletinde \"Dönüştür\" ifadesini arayın."
guide_convert_s3: "Dairesel menüde gezinmek için yön tuşlarını kullanın veya doğrudan bir biçime tıklayın."
guide_convert_s4: "Enter tuşuna basın. Yeni dosyalar özgün dosyaların yanında görünür; özgün dosyalarınıza dokunulmaz."
guide_convert_tip: "İpucu: Dönüştürme arka planda çalışırken çalışmaya devam edebilirsiniz."
guide_analyze_title: "Neyin yer kapladığını görün"
guide_analyze_lead: "Bir sürücüdeki en büyük klasörleri ve geçici dosyaları bulun ve güvenle alan boşaltın."
guide_analyze_s1: "Kenar çubuğunda bir sürücüye sağ tıklayın."
guide_analyze_s2: "\"Analiz et ve alan boşalt…\" seçeneğini belirleyin."
guide_analyze_s3: "Haritayı keşfedin: Her bloğun alanı boyutunu gösterir. Daha derine inmek için çift tıklayın."
guide_analyze_s4: "Herhangi bir şey silinmeden önce önerilen geçici dosyaları inceleyin."
guide_analyze_tip: "İpucu: İncelemeniz olmadan hiçbir şey silinmez."
guide_vault_title: "Bir klasörü parola ile koruyun"
guide_vault_lead: "Bir klasörü kilitleyerek içeriğinin parola olmadan okunamaz olmasını sağlayın."
guide_vault_s1: "Korumak istediğiniz klasöre sağ tıklayın."
guide_vault_s2: "\"Parola ile koru…\" seçeneğini belirleyin ve bir parola belirleyin."
guide_vault_s3: "Tekrar açmak için sağ tıklayın ve \"Kilidi aç…\" seçeneğini belirleyin."
guide_vault_s4: "Parolanızı güvenli bir yerde saklayın: Kaybolursa klasör kurtarılamaz."
guide_vault_tip: "İpucu: Korumalı klasörü hangi profillerin görebileceğini seçebilirsiniz."
guide_tags_title: "Etiketlerle düzenleyin"
guide_tags_lead: "Etiketler, nerede olurlarsa olsunlar dosyaları işaretler; böylece onları daha sonra bir arada bulabilirsiniz."
guide_tags_s1: "Kenar çubuğunda Etiketler bölümünü açın ve bir etiket oluşturun."
guide_tags_s2: "Dosyaları seçin ve etiket seçiciyi açın. Bir etiket oluşturmak veya açıp kapatmak için bir ad yazın."
guide_tags_s3: "O etikete sahip tüm dosyaları görmek için kenar çubuğundaki bir etikete tıklayın."
guide_tags_s4: "Sağ tıklama menüsünden bir etiketi yeniden adlandırın veya silin."
guide_tags_tip: "İpucu: Bir dosyanın birden çok etiketi olabilir."
guide_cloud_title: "Bulut sürücülerinizi kullanın"
guide_cloud_lead: "Bulut hizmetlerindeki dosyalara sanki klasörmüş gibi göz atın ve kopyalayın."
guide_cloud_s1: "Kenar çubuğunda Ağ bölümünü açın."
guide_cloud_s2: "\"Bulut sürücüsü ekle\" seçeneğini belirleyin ve sağlayıcınızı seçin."
guide_cloud_s3: "İstendiğinde oturum açın. Sürücü daha sonra kenar çubuğunda görünür."
guide_cloud_s4: "Dosyaları bulut ile bilgisayarınız arasında sürükleyin. İlerleme durumu transferler çubuğunda gösterilir."
guide_cloud_tip: "İpucu: Kimlik bilgileriniz bu bilgisayarda kalır."
guide_themes_title: "Atlas'ı kendinize göre özelleştirin"
guide_themes_lead: "Profil bazında temayı ve dosya simgelerini değiştirin."
guide_themes_s1: "Ayarları aşağıdaki kısayolla açın."
guide_themes_s2: "Bir tema seçin. Her profil kendisininkini korur."
guide_themes_s3: "Dosya simgelerini değiştirmek için komut paletinde \"Simge Teması Seç…\" komutunu kullanın."
guide_themes_s4: "Daha fazla simge seti edinmek için \"Simge Teması İndir…\" komutunu kullanın."
guide_themes_tip: "İpucu: İlk çalıştırma kurulumunu paletten istediğiniz zaman yeniden açabilirsiniz: \"Başlarken\"."
guide_open_link: "Tüm özellik rehberini aç"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Hızlı önizleme (Quick Look)"
