guide_convert_s4: "Starten Sie die Konvertierung. Das Ergebnis wird neben dem Original gespeichert."
guide_convert_tip: "Tipp: Manche Formate benötigen optionale Module, die Atlas auf Wunsch installiert."
guide_analyze_title: "Speicherplatzfresser aufspüren"
guide_analyze_lead: "Finden Sie die größten Ordner und temporäre Dateien und geben Sie sicher Speicherplatz frei."
guide_analyze_s1: "Klicken Sie mit der rechten Maustaste auf ein Laufwerk in der Seitenleiste."
guide_analyze_s2: "Wählen Sie „Analysieren & Speicher freigeben…“."
guide_analyze_s3: "Erkunden Sie die Kachelkarte: Die Blockfläche zeigt die Größe. Doppelklick zum Eintauchen."
guide_analyze_s4: "Prüfen Sie vorgeschlagene temporäre Dateien vor dem Löschen."
guide_analyze_tip: "Tipp: Nichts wird ohne Ihre Überprüfung gelöscht."
guide_vault_title: "Ordner mit Kennwort schützen"
guide_vault_lead: "Sperren Sie einen Ordner, damit dessen Inhalt ohne Kennwort unlesbar bleibt."
guide_vault_s1: "Rechtsklick auf den Ordner, den Sie schützen möchten."
guide_vault_s2: "Wählen Sie „Mit Kennwort schützen…“ und vergeben Sie ein Kennwort."
guide_vault_s3: "Zum erneuten Öffnen Rechtsklick darauf und „Entsperren…“ wählen."
guide_vault_s4: "Kennwort sicher aufbewahren: Geht es verloren, kann der Ordner nicht wiederhergestellt werden."
guide_vault_tip: "Tipp: Sie können wählen, welche Profile den geschützten Ordner sehen dürfen."
guide_tags_title: "Mit Tags organisieren"
guide_tags_lead: "Kennzeichnen Sie Dateien standortunabhängig, um sie später gebündelt zu finden."
guide_tags_s1: "Öffnen Sie in der Seitenleiste den Bereich Tags und erstellen Sie einen Tag."
guide_tags_s2: "Dateien auswählen und Tag-Auswahl öffnen. Namen tippen zum Erstellen oder Zuweisen."
guide_tags_s3: "Auf einen Tag in der Seitenleiste klicken, um alle zugehörigen Dateien zu sehen."
guide_tags_s4: "Tags über das Kontextmenü umbenennen oder löschen."
guide_tags_tip: "Tipp: Eine Datei kann mehrere Tags gleichzeitig besitzen."
guide_cloud_title: "Cloud-Laufwerke einbinden"
guide_cloud_lead: "Durchsuchen und kopieren Sie Dateien von und zu Cloud-Diensten wie bei normalen Ordnern."
guide_cloud_s1: "Öffnen Sie in der Seitenleiste den Bereich Netzwerk."
guide_cloud_s2: "Wählen Sie „Cloud-Speicher hinzufügen“ und Ihren Anbieter."
guide_cloud_s3: "Bei Aufforderung anmelden. Das Laufwerk erscheint danach in der Seitenleiste."
guide_cloud_s4: "Dateien zwischen Cloud und PC ziehen. Fortschritt erscheint in der Übertragungsleiste."
guide_cloud_tip: "Tipp: Ihre Anmeldedaten verbleiben sicher auf diesem Gerät."
guide_themes_title: "Atlas individuell gestalten"
guide_themes_lead: "Passen Sie Farbschema und Datei-Symbole pro Profil nach Ihren Wünschen an."
guide_themes_s1: "Öffnen Sie die Einstellungen mit dem Tastenkürzel unten."
guide_themes_s2: "Wählen Sie ein Design. Jedes Profil speichert sein eigenes."
guide_themes_s3: "Nutzen Sie „Symbol-Design auswählen…“ in der Befehlspalette, um Datei-Symbole zu ändern."
guide_themes_s4: "Nutzen Sie „Symbol-Design herunterladen…“, um weitere Symbolpakete zu laden."
guide_themes_tip: "Tipp: Sie können die Ersteinrichtung jederzeit über die Palette erneut öffnen: „Erste Schritte“."
guide_open_link: "Vollständige Funktionsübersicht öffnen"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Schnellvorschau (Quick Look)"
