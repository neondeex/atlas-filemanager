convert_first_frame: "단일 이미지: 첫 번째 페이지 또는 프레임을 내보냅니다."
convert_all_pages_note: "모든 페이지를 300 DPI로 폴더에 저장합니다. 더 작은 크기를 선택하면 해상도가 낮아집니다."
convert_pdf_ocr_note: "모든 페이지에 Windows OCR을 실행합니다. 인식된 텍스트를 검토하세요. 레이아웃을 재구성하지 않고 페이지 구분을 유지합니다. Windows에 해당 OCR 언어가 설치되어 있어야 합니다."
convert_word_package_note: "Word 패키지의 스타일, 이미지, 표, 머리글을 보존합니다. DOCX 생성 시 매크로와 디지털 서명은 제거됩니다."
convert_first_sheet: "CSV 및 TSV는 첫 번째 시트만 내보냅니다. JSON에는 모든 시트가 포함됩니다."
convert_jpeg_note: "JPEG는 투명 픽셀 뒤에 흰색 배경을 사용합니다."
convert_webp_note: "네이티브 WebP는 무손실 압축이며 품질 설정이 적용되지 않습니다."
convert_pdf_text_note: "레이아웃을 재구성하지 않고 텍스트를 보존합니다. 스캔된 PDF는 OCR이 필요합니다."
convert_doc_text_note: "스타일이나 이미지 없이 문서 텍스트만 내보냅니다."
convert_data_note: "CSV 및 TSV는 표 형태가 필요합니다. TOML은 null 값을 표현할 수 없습니다."
convert_needs: "이 컴퓨터에 %{engine}이(가) 설치되어 있어야 합니다."
convert_get_engine: "%{engine} 다운로드"
convert_rescan: "엔진 다시 감지"
convert_quality: "품질"
convert_windows_audio_note: "Windows 코덱을 사용합니다. MP3/AAC/M4A: 최대 스테레오, 샘플레이트가 변경될 수 있습니다. 태그와 앨범 아트는 제외됩니다."
convert_windows_video_note: "Windows H.264/AAC 코덱을 사용하는 프로그레시브 SDR MP4입니다. 첫 번째 비디오/오디오 트랙, 최대 스테레오, 디인터레이스될 수 있습니다. 자막 및 메타데이터는 제외됩니다."
convert_subtitle_note: "텍스트와 타이밍을 유지하며 스타일과 배치는 제외됩니다. 종료 신호가 없는 LRC/SAMI는 마지막 자막이 5초간 지속됩니다."
convert_subtitle_linear_note: "LRC/SAMI는 겹치지 않는 자막 큐가 필요합니다. LRC는 줄 바꿈을 병합하며 스타일은 제외됩니다."
convert_contacts_note: "일반 연락처 필드를 내보냅니다. 사진, 라벨 및 사용자 지정 속성은 원본에 유지됩니다."
convert_book_note: "텍스트 기반 서적: 이미지, 스타일, 챕터 구조가 제외됩니다. 암호화된 콘텐츠는 변환되지 않습니다."
convert_pcm_note: "8/16/24/32비트 정수 PCM: 샘플, 채널, 전송률을 유지합니다. 메타데이터는 제외됩니다."
convert_flac_note: "자체 제작 무손실 FLAC: 8/16/24/32비트 정수 PCM, 최대 8채널. 샘플을 보존하며 메타데이터는 제외됩니다."
convert_opus_note: "48 kHz 손실 오디오, 최대 8채널. 태그와 앨범 커버는 제외됩니다."
