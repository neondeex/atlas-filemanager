cmd_sys_guide_desc: "Atlas의 다양한 기능을 단계별로 알아봅니다."
guide_title: "Atlas 가이드"
guide_try: "지금 사용해 보기"
guide_shortcut: "단축키:"
guide_goto_title: "빠른 파일 찾기"
guide_goto_lead: "파일이나 폴더 이름의 몇 글자만 입력하여 바로 이동하세요. 폴더를 일일이 클릭할 필요가 없습니다."
guide_goto_s1: "아래 단축키를 누르거나 Atlas 메뉴에서 이동(Goto)을 엽니다."
guide_goto_s2: "이름의 일부를 입력합니다. 글자가 연속되지 않아도 찾을 수 있습니다."
guide_goto_s3: "방향키로 결과를 선택하고 Enter 키를 눌러 엽니다."
guide_goto_s4: "작업하지 않고 닫으려면 Esc 키를 누릅니다."
guide_goto_tip: "팁: 전체 경로를 붙여넣어 해당 위치로 바로 이동할 수도 있습니다."
guide_commands_title: "키보드로 모든 작업 수행"
guide_commands_lead: "명령 팔레트에 Atlas의 모든 동작이 나열됩니다. 원하는 기능의 위치를 모를 때는 여기서 검색하세요."
guide_commands_s1: "아래 단축키를 눌러 명령 팔레트를 엽니다."
guide_commands_s2: "원하는 동작을 입력하세요: \"아이콘\", \"분할\", \"테마\", \"숨김 파일\" 등."
guide_commands_s3: "Enter 키를 눌러 실행합니다. 각 명령의 단축키가 오른쪽에 표시됩니다."
guide_commands_s4: "설정에서 거의 모든 명령의 단축키를 원하는 대로 변경할 수 있습니다."
guide_commands_tip: "팁: 명령 목록을 한 번 둘러보는 것이 Atlas를 가장 빠르게 익히는 방법입니다."
guide_views_title: "파일 보기 방식 변경"
guide_views_lead: "각 창마다 폴더 특성에 맞게 파일을 표시할 수 있습니다. 사진은 썸네일로, 문서는 자세한 목록으로 보세요."
guide_views_s1: "명령 팔레트를 열고 \"보기\"를 입력합니다."
guide_views_s2: "자세히, 목록, 큰 아이콘, 열 (밀러), 트리 보기 중에서 선택합니다."
guide_views_s3: "팔레트에서 \"분류 방법\"을 사용하여 날짜, 크기, 유형별로 그룹화합니다."
guide_views_s4: "검사기를 토글하여 목록 옆에서 선택한 파일의 미리 보기를 확인합니다."
guide_views_tip: "팁: 각 폴더마다 고유한 보기 설정을 기억할 수 있습니다."
guide_panes_title: "여러 위치에서 동시에 작업"
guide_panes_lead: "창을 분할 창과 탭으로 나누어 폴더를 비교하거나 파일 간에 손쉽게 이동하세요."
guide_panes_s1: "명령 팔레트에서 \"가로 분할\" 또는 \"세로 분할\"을 실행합니다."
guide_panes_s2: "각 창에서 폴더를 엽니다. 창을 클릭하면 해당 창으로 포커스가 이동합니다."
guide_panes_s3: "창 간에 파일을 끌어다 놓아 복사하거나 이동합니다."
guide_panes_s4: "창 내에서 탭을 사용하여 더 많은 폴더를 열어두고 작업할 수 있습니다."
guide_panes_tip: "팁: 한 창을 닫으면 나머지 창이 화면에 맞게 자동으로 확장됩니다."
guide_convert_title: "파일을 다른 형식으로 변환"
guide_convert_lead: "Atlas를 벗어나지 않고도 이미지, 오디오, 비디오 및 문서를 다른 파일 형식으로 변환할 수 있습니다."
guide_convert_s1: "변환할 파일을 하나 이상 선택합니다."
guide_convert_s2: "아래 단축키를 누르거나 마우스 오른쪽 버튼 메뉴에서 변환을 엽니다."
guide_convert_s3: "출력 형식과 변환 옵션을 선택합니다."
guide_convert_s4: "변환을 시작합니다. 결과 파일은 원본 파일 옆에 안전하게 저장됩니다."
guide_convert_tip: "팁: 일부 형식에는 선택적 변환 엔진이 필요하며, Atlas에서 바로 설치할 수 있습니다."
guide_analyze_title: "디스크 사용 현황 확인"
guide_analyze_lead: "드라이브에서 가장 큰 용량을 차지하는 폴더와 임시 파일을 찾아 안전하게 여유 공간을 확보하세요."
guide_analyze_s1: "사이드바에서 드라이브를 마우스 오른쪽 버튼으로 클릭합니다."
guide_analyze_s2: "\"분석 및 공간 확보…\"를 선택합니다."
guide_analyze_s3: "지도를 살펴봅니다. 각 블록의 면적이 파일 크기를 나타냅니다. 더 깊이 탐색하려면 두 번 클릭하세요."
guide_analyze_s4: "항목이 삭제되기 전에 추천된 임시 파일을 꼼꼼히 검토합니다."
guide_analyze_tip: "팁: 사용자의 확인 및 검토 없이 파일이 자동으로 삭제되지 않습니다."
guide_vault_title: "비밀번호로 폴더 보호"
guide_vault_lead: "폴더를 암호화하여 잠그면 올바른 비밀번호 없이는 내용을 전혀 읽을 수 없습니다."
guide_vault_s1: "보호할 폴더를 마우스 오른쪽 버튼으로 클릭합니다."
guide_vault_s2: "\"비밀번호로 보호…\"를 선택하고 비밀번호를 설정합니다."
guide_vault_s3: "다시 열려면 폴더를 마우스 오른쪽 버튼으로 클릭하고 \"잠금 해제…\"를 선택합니다."
guide_vault_s4: "비밀번호를 안전하게 보관하세요. 잊어버리면 폴더 내용을 복구할 수 없습니다."
guide_vault_tip: "팁: 보호된 폴더를 볼 수 있는 프로필을 선택할 수 있습니다."
guide_tags_title: "태그로 파일 정리"
guide_tags_lead: "파일의 위치와 상관없이 태그를 지정해 두면 나중에 한 번에 모아서 찾을 수 있습니다."
guide_tags_s1: "사이드바에서 태그 섹션을 열고 새 태그를 생성합니다."
guide_tags_s2: "파일을 선택하고 태그 선택기를 엽니다. 이름을 입력하여 태그를 생성하거나 지정합니다."
guide_tags_s3: "사이드바에서 태그를 클릭하면 해당 태그가 지정된 모든 파일이 표시됩니다."
guide_tags_s4: "마우스 오른쪽 버튼 메뉴에서 태그 이름을 바꾸거나 삭제할 수 있습니다."
guide_tags_tip: "팁: 하나의 파일에 여러 개의 태그를 지정할 수 있습니다."
guide_cloud_title: "클라우드 드라이브 활용"
guide_cloud_lead: "클라우드 서비스의 파일을 마치 로컬 컴퓨터 폴더처럼 탐색하고 복사하세요."
guide_cloud_s1: "사이드바에서 네트워크 섹션을 엽니다."
guide_cloud_s2: "\"클라우드 드라이브 추가\"를 선택하고 서비스 제공업체를 고릅니다."
guide_cloud_s3: "안내에 따라 로그인하면 드라이브가 사이드바에 나타납니다."
guide_cloud_s4: "클라우드와 컴퓨터 간에 파일을 끌어다 놓으세요. 진행 상황은 전송 표시줄에 표시됩니다."
guide_cloud_tip: "팁: 계정 자격 증명은 이 컴퓨터에만 안전하게 보관됩니다."
guide_themes_title: "나만의 스타일로 커스텀"
guide_themes_lead: "프로필별로 개별 UI 테마와 파일 아이콘을 원하는 대로 변경하세요."
guide_themes_s1: "아래 단축키를 눌러 설정을 엽니다."
guide_themes_s2: "원하는 테마를 선택하세요. 프로필마다 서로 다른 테마를 유지할 수 있습니다."
guide_themes_s3: "명령 팔레트에서 \"아이콘 테마 선택...\"을 사용하여 파일 아이콘을 변경합니다."
guide_themes_s4: "\"아이콘 테마 다운로드...\"를 실행하여 더 많은 아이콘 세트를 가져올 수 있습니다."
guide_themes_tip: "팁: 언제든지 명령 팔레트에서 \"시작 가이드\"를 검색하여 초기 설정 환경을 다시 열 수 있습니다."
guide_open_link: "전체 기능 가이드 열기"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "빠른 미리 보기 (Quick Look)"
