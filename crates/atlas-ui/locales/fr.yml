crash_report_sent: "Rapport envoyé. Merci !"
crash_report_failed: "Impossible d’envoyer le rapport. Vérifiez votre connexion et réessayez."
crash_report_none: "Aucun rapport de plantage pour la dernière session."
crash_report_already_sent: "Ce rapport a déjà été envoyé."
