"cmd_sys_guide_title": "Guide des fonctionnalités"
"cmd_sys_guide_desc": "Découvrez ce qu'Atlas peut faire, étape par étape."
"guide_title": "Guide d'Atlas"
"guide_try": "Essayer maintenant"
"guide_shortcut": "Raccourci :"
"guide_goto_title": "Trouver rapidement n'importe quel élément"
"guide_goto_lead": "Accédez à n'importe quel fichier ou dossier en tapant quelques\
  \ lettres de son nom. Plus besoin de naviguer de dossier en dossier."
"guide_goto_s1": "Ouvrez « Accéder à » avec le raccourci ci-dessous ou depuis le menu\
  \ Atlas."
"guide_goto_s2": "Tapez une partie du nom. Les lettres n'ont pas besoin d'être consécutives."
"guide_goto_s3": "Utilisez les touches de direction pour choisir un résultat et appuyez\
  \ sur Entrée pour l'ouvrir."
"guide_goto_s4": "Appuyez sur Échap pour fermer sans effectuer d'action."
"guide_goto_tip": "Astuce : vous pouvez aussi coller un chemin complet pour y accéder\
  \ directement."
"guide_commands_title": "Tout faire au clavier"
"guide_commands_lead": "La palette de commandes répertorie toutes les actions disponibles\
  \ dans Atlas. Si vous ne trouvez pas une option, cherchez-la ici."
"guide_commands_s1": "Ouvrez la palette avec le raccourci ci-dessous."
"guide_commands_s2": "Tapez ce que vous souhaitez : « grille », « fractionner », «\
  \ thème », « masqués »."
"guide_commands_s3": "Appuyez sur Entrée pour exécuter. Le raccourci associé à chaque\
  \ commande s'affiche à droite."
"guide_commands_s4": "Dans les Paramètres, vous pouvez personnaliser le raccourci\
  \ de presque chaque commande."
"guide_commands_tip": "Astuce : c'est le moyen le plus rapide d'apprendre à utiliser\
  \ Atlas. Parcourez la liste une première fois."
"guide_views_title": "Personnaliser l'affichage des fichiers"
"guide_views_lead": "Chaque volet peut afficher ses fichiers selon le mode le plus\
  \ adapté : photos en miniatures, documents en liste détaillée."
"guide_views_s1": "Ouvrez la palette de commandes et tapez « Affichage »."
"guide_views_s2": "Choisissez Détails, Liste, Miniatures, Colonnes (Miller) ou Arborescence."
"guide_views_s3": "Utilisez « Grouper par » dans la palette pour regrouper par date,\
  \ taille, type et plus encore."
"guide_views_s4": "Activez l'Aperçu pour visualiser le fichier sélectionné à côté\
  \ de la liste."
"guide_views_tip": "Astuce : chaque dossier peut mémoriser son propre mode d'affichage."
"guide_panes_title": "Travailler dans plusieurs emplacements à la fois"
"guide_panes_lead": "Fractionnez la fenêtre en plusieurs volets et onglets pour comparer\
  \ des dossiers ou déplacer des fichiers facilement."
"guide_panes_s1": "Exécutez « Fractionner horizontalement » ou « Fractionner verticalement\
  \ » depuis la palette de commandes."
"guide_panes_s2": "Ouvrez des dossiers dans chaque volet. Cliquez sur un volet pour\
  \ lui donner le focus."
"guide_panes_s3": "Faites glisser des fichiers d'un volet à l'autre pour les copier\
  \ ou les déplacer."
"guide_panes_s4": "Utilisez les onglets dans un volet pour garder davantage de dossiers\
  \ sous la main."
"guide_panes_tip": "Astuce : fermez un volet et les autres s'ajustent automatiquement\
  \ pour occuper l'espace."
"guide_convert_title": "Convertir un fichier dans un autre format"
"guide_convert_lead": "Changez le format d'images, de documents, de vidéos et de fichiers\
  \ audio directement depuis Atlas, sans modifier vos originaux."
"guide_convert_s1": "Sélectionnez un ou plusieurs fichiers du même type."
"guide_convert_s2": "Ouvrez la roue de conversion avec le raccourci ci-dessous ou\
  \ depuis le menu contextuel."
"guide_convert_s3": "Choisissez le format de sortie à l'aide des touches fléchées\
  \ ou de la souris."
"guide_convert_s4": "Appuyez sur Entrée. Le fichier converti apparaît à côté de l'original."
"guide_convert_tip": "Astuce : si vous sélectionnez des fichiers de types différents,\
  \ vous pouvez créer une archive ZIP directement."
"guide_analyze_title": "Visualiser et libérer de l'espace disque"
"guide_analyze_lead": "Identifiez rapidement les éléments qui occupent de l'espace\
  \ sur votre disque et libérez de la place en toute sécurité."
"guide_analyze_s1": "Faites un clic droit sur un lecteur dans la barre latérale."
"guide_analyze_s2": "Choisissez « Analyser et libérer de l'espace… »."
"guide_analyze_s3": "Explorez la carte : la surface de chaque bloc reflète sa taille.\
  \ Double-cliquez pour explorer plus en détail."
"guide_analyze_s4": "Examinez les fichiers temporaires suggérés avant qu'aucun élément\
  \ ne soit supprimé."
"guide_analyze_tip": "Astuce : rien n'est supprimé sans votre validation préalable."
"guide_vault_title": "Protéger un dossier avec un mot de passe"
"guide_vault_lead": "Verrouillez un dossier pour rendre son contenu illisible sans\
  \ le mot de passe."
"guide_vault_s1": "Faites un clic droit sur le dossier que vous souhaitez protéger."
"guide_vault_s2": "Choisissez « Protéger par mot de passe… » et définissez un mot\
  \ de passe."
"guide_vault_s3": "Pour l'ouvrir à nouveau, faites un clic droit et choisissez « Déverrouiller…\
  \ »."
"guide_vault_s4": "Conservez précieusement votre mot de passe : en cas de perte, le\
  \ dossier ne pourra pas être récupéré."
"guide_vault_tip": "Astuce : vous pouvez choisir quels profils peuvent voir le dossier\
  \ protégé."
"guide_tags_title": "Organiser avec des étiquettes"
"guide_tags_lead": "Les étiquettes vous permettent de repérer vos fichiers quel que\
  \ soit leur emplacement pour les regrouper facilement."
"guide_tags_s1": "Dans la barre latérale, ouvrez la section Étiquettes et créez une\
  \ étiquette."
"guide_tags_s2": "Sélectionnez des fichiers et ouvrez le sélecteur d'étiquettes. Tapez\
  \ un nom pour créer ou appliquer une étiquette."
"guide_tags_s3": "Cliquez sur une étiquette dans la barre latérale pour afficher tous\
  \ les fichiers associés."
"guide_tags_s4": "Renommez ou supprimez une étiquette depuis son menu contextuel."
"guide_tags_tip": "Astuce : un fichier peut comporter plusieurs étiquettes."
"guide_cloud_title": "Utiliser vos lecteurs cloud"
"guide_cloud_lead": "Parcourez et copiez des fichiers vers et depuis des services\
  \ cloud comme s'il s'agissait de dossiers locaux."
"guide_cloud_s1": "Dans la barre latérale, ouvrez la section Réseau."
"guide_cloud_s2": "Choisissez « Ajouter un lecteur cloud » et sélectionnez votre fournisseur."
"guide_cloud_s3": "Connectez-vous lorsque cela vous est demandé. Le lecteur apparaît\
  \ ensuite dans la barre latérale."
"guide_cloud_s4": "Glissez-déposez des fichiers entre le cloud et votre ordinateur.\
  \ La progression s'affiche dans la barre des transferts."
"guide_cloud_tip": "Astuce : vos identifiants restent stockés localement sur cet ordinateur."
"guide_themes_title": "Personnaliser Atlas à votre image"
"guide_themes_lead": "Personnalisez le thème graphique et les icônes de fichiers,\
  \ pour chaque profil."
"guide_themes_s1": "Ouvrez les Paramètres avec le raccourci ci-dessous."
"guide_themes_s2": "Choisissez un thème. Chaque profil conserve ses propres préférences."
"guide_themes_s3": "Utilisez « Sélectionner un thème d'icônes... » dans la palette\
  \ de commandes pour changer les icônes."
"guide_themes_s4": "Utilisez « Télécharger un thème d'icônes... » pour obtenir de\
  \ nouveaux ensembles d'icônes."
"guide_themes_tip": "Astuce : vous pouvez rouvrir l'assistant de configuration initial\
  \ à tout moment depuis la palette : « Prise en main »."
"guide_open_link": "Ouvrir le guide complet des fonctionnalités"

