guide_title: "Atlas-guide"
guide_try: "Prova nu"
guide_shortcut: "Kortkommando:"
guide_goto_title: "Hitta vad som helst snabbt"
guide_goto_lead: "Hoppa till valfri mapp eller fil genom att skriva några bokstäver i dess namn. Slipp klicka dig fram genom mappar."
guide_goto_s1: "Öppna Gå till med kortkommandot nedan eller från Atlas-menyn."
guide_goto_s2: "Skriv en del av ett namn. Bokstäverna behöver inte sitta ihop."
guide_goto_s3: "Använd piltangenterna för att välja ett resultat och tryck på Enter för att öppna det."
guide_goto_s4: "Tryck på Esc för att stänga utan att göra något."
guide_goto_tip: "Tips: Du kan också klistra in en fullständig sökväg för att gå direkt dit."
guide_commands_title: "Gör vad som helst från tangentbordet"
guide_commands_lead: "Kommandopaletten listar alla åtgärder i Atlas. Om du inte vet var något finns, sök efter det här."
guide_commands_s1: "Öppna paletten med kortkommandot nedan."
guide_commands_s2: "Skriv vad du vill: \"rutnät\", \"dela\", \"tema\", \"dolda\"."
guide_commands_s3: "Tryck på Enter för att köra kommandot. Kortkommandot för varje kommando visas till höger."
guide_commands_s4: "I Inställningar kan du ändra kortkommandot för nästan vilket kommando som helst."
guide_commands_tip: "Tips: Det här är det snabbaste sättet att lära sig Atlas. Bläddra igenom listan en gång."
guide_views_title: "Ändra hur filer visas"
guide_views_lead: "Varje panel kan visa filer på det sätt som passar mappen bäst: foton som miniatyrer, dokument som en detaljerad lista."
guide_views_s1: "Öppna kommandopaletten och skriv \"Visa\"."
guide_views_s2: "Välj Information, Lista, Miniatyrer, Kolumner (Miller) eller Träd."
guide_views_s3: "Använd \"Gruppera efter\" i paletten för att gruppera efter datum, storlek, typ med mera."
guide_views_s4: "Slå på förhandsgranskningen för att se den markerade filen bredvid listan."
guide_views_tip: "Tips: Varje mapp kan komma ihåg sin egen vy."
guide_panes_title: "Arbeta på flera platser samtidigt"
guide_panes_lead: "Dela fönstret i paneler och flikar för att jämföra mappar eller flytta filer mellan dem."
guide_panes_s1: "Kör \"Dela horisontellt\" eller \"Dela vertikalt\" från kommandopaletten."
guide_panes_s2: "Öppna mappar i varje panel. Klicka på en panel för att fokusera den."
guide_panes_s3: "Dra filer från en panel till en annan för att kopiera eller flytta dem."
guide_panes_s4: "Använd flikar i en panel för att ha fler mappar nära till hands."
guide_panes_tip: "Tips: Stäng en panel så expanderar de andra för att fylla utrymmet."
guide_convert_title: "Konvertera en fil till ett annat format"
guide_convert_lead: "Omvandla bilder, ljud, video och dokument till andra format utan att lämna Atlas."
guide_convert_s1: "Välj en eller flera filer."
guide_convert_s2: "Öppna Konvertera med kortkommandot nedan eller från snabbmenyn."
guide_convert_s3: "Välj utdataformat och alternativ."
guide_convert_s4: "Starta konverteringen. Resultatet sparas bredvid originalet."
guide_convert_tip: "Tips: Vissa format kräver en valfri motor som Atlas erbjuder att installera."
guide_analyze_title: "Se vad som använder diskutrymme"
guide_analyze_lead: "Hitta de största mapparna och temporära filerna på en enhet och frigör utrymme på ett säkert sätt."
guide_analyze_s1: "Högerklicka på en enhet i sidofältet."
guide_analyze_s2: "Välj \"Analysera och frigör utrymme…\"."
guide_analyze_s3: "Utforska kartan: varje blocks yta motsvarar dess storlek. Dubbelklicka för att gå djupare."
guide_analyze_s4: "Granska de föreslagna temporära filerna innan något tas bort."
guide_analyze_tip: "Tips: Ingenting tas bort utan din granskning."
guide_vault_title: "Skydda en mapp med ett lösenord"
guide_vault_lead: "Lås en mapp så att dess innehåll blir oläsligt utan lösenordet."
guide_vault_s1: "Högerklicka på mappen du vill skydda."
guide_vault_s2: "Välj \"Lösenordsskydda…\" och ange ett lösenord."
guide_vault_s3: "För att öppna den igen, högerklicka på den och välj \"Lås upp…\"."
guide_vault_s4: "Förvara ditt lösenord säkert: om det förloras kan mappen inte återställas."
guide_vault_tip: "Tips: Du kan välja vilka profiler som kan se den skyddade mappen."
guide_tags_title: "Organisera med taggar"
guide_tags_lead: "Taggar märker filer oavsett var de finns, så att du enkelt hittar dem tillsammans senare."
guide_tags_s1: "Öppna avsnittet Taggar i sidofältet och skapa en tagg."
guide_tags_s2: "Markera filer och öppna taggväljaren. Skriv ett namn för att skapa eller växla en tagg."
guide_tags_s3: "Klicka på en tagg i sidofältet för att se alla filer som har den."
guide_tags_s4: "Byt namn på eller ta bort en tagg från dess snabbmeny."
guide_tags_tip: "Tips: En fil kan ha flera taggar."
guide_cloud_title: "Använd dina molnenheter"
guide_cloud_lead: "Bläddra och kopiera filer till och från molntjänster som om de vore vanliga mappar."
guide_cloud_s1: "Öppna avsnittet Nätverk i sidofältet."
guide_cloud_s2: "Välj \"Lägg till molnenhet\" och välj din leverantör."
guide_cloud_s3: "Logga in när du uppmanas till det. Enheten visas sedan i sidofältet."
guide_cloud_s4: "Dra filer mellan molnet och datorn. Förloppet visas i överföringsfältet."
guide_cloud_tip: "Tips: Dina inloggningsuppgifter stannar på den här datorn."
guide_themes_title: "Gör Atlas till ditt eget"
guide_themes_lead: "Ändra tema och filikoner individuellt per profil."
guide_themes_s1: "Öppna Inställningar med kortkommandot nedan."
guide_themes_s2: "Välj ett tema. Varje profil behåller sitt eget."
guide_themes_s3: "Använd \"Välj ikontema…\" i kommandopaletten för att byta filikoner."
guide_themes_s4: "Använd \"Ladda ned ikontema…\" för att hämta fler ikonpaket."
guide_themes_tip: "Tips: Du kan öppna startguiden när som helst från paletten: \"Kom igång\"."
guide_open_link: "Öppna den fullständiga funktionsguiden"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Snabbvisning (Quick Look)"
