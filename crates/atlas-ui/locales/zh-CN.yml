cmd_sys_guide_title: "功能指南"
cmd_sys_guide_desc: "循序渐进了解 Atlas 的强大功能。"
guide_title: "Atlas 功能指南"
guide_try: "立即体验"
guide_shortcut: "快捷键:"
guide_goto_title: "快速查找任意内容"
guide_goto_lead: "输入名称中的几个字母即可直接跳转到任意文件夹或文件，无需层层点击。"
guide_goto_s1: "使用下方的快捷键或从 Atlas 菜单中打开“跳转”。"
guide_goto_s2: "输入名称的一部分。字母无需紧密相连。"
guide_goto_s3: "使用方向键选取匹配项，按 Enter 键即可直接打开。"
guide_goto_s4: "按 Esc 键可随时退出且不执行任何操作。"
guide_goto_tip: "提示: 您也可以直接粘贴完整路径以直达目标位置。"
guide_commands_title: "完全通过键盘操作一切"
guide_commands_lead: "命令面板列出了 Atlas 中的所有可用操作。如果不确定某项功能的位置，可在此处直接搜索。"
guide_commands_s1: "使用下方的快捷键打开命令面板。"
guide_commands_s2: "输入您需要的操作关键字: 如“大图标”、“拆分”、“主题”、“隐藏”。"
guide_commands_s3: "按 Enter 键执行。各命令对应的快捷键显示在右侧。"
guide_commands_s4: "在“设置”中，您可以根据习惯自定义几乎所有命令的快捷键。"
guide_commands_tip: "提示: 这是熟悉 Atlas 最快的方式。不妨完整浏览一次命令列表。"
guide_views_title: "自定义文件显示方式"
guide_views_lead: "每个窗格都可以按最适合其内容的视图显示: 照片显示为缩略图，文档显示为详细信息列表。"
guide_views_s1: "打开命令面板并输入“视图”。"
guide_views_s2: "选择“详细信息”、“列表”、“缩略图”、“分栏 (米勒列)”或“树状图”。"
guide_views_s3: "在命令面板中使用“分组依据”，按日期、大小、类型等进行分组归类。"
guide_views_s4: "开启检查器/预览面板，在列表旁即时预览所选文件。"
guide_views_tip: "提示: 每个文件夹都可以独立记住自身的视图设置。"
guide_panes_title: "多位置高效协同处理"
guide_panes_lead: "将窗口拆分为多个窗格和标签页，轻松对比文件夹或在它们之间搬运文件。"
guide_panes_s1: "从命令面板中运行“水平拆分”或“垂直拆分”。"
guide_panes_s2: "在各窗格中分别打开目标文件夹。点击窗格即可切换聚焦。"
guide_panes_s3: "从一个窗格直接拖动文件到另一个窗格以执行复制或移动。"
guide_panes_s4: "在窗格内部使用标签页，随时保留多个常用文件夹。"
guide_panes_tip: "提示: 关闭窗格后，其余窗格将自动平铺填满可用空间。"
guide_convert_title: "转换文件至其他格式"
guide_convert_lead: "直接将图像、视频、音频和文档转换为常用格式，原文件绝不被改动。"
guide_convert_s1: "在列表中选择一个或多个要转换的文件。"
guide_convert_s2: "使用下方的快捷键打开文件转换轮盘。"
guide_convert_s3: "使用方向键转动轮盘选择目标输出格式。"
guide_convert_s4: "按 Enter 键立即开始转换。转换生成的新文件将保存在原文件旁边。"
guide_convert_tip: "提示: 一次性选中多个文件可进行批量转换。"
guide_analyze_title: "查看磁盘占用情况"
guide_analyze_lead: "通过交互式矩形树图可视化查看磁盘空间，并安全清理无用临时文件。"
guide_analyze_s1: "在侧边栏中右键点击目标磁盘驱动器。"
guide_analyze_s2: "选择“分析并释放空间…”。"
guide_analyze_s3: "探索空间分布图: 每个矩形方块的面积代表其占用大小。双击可进入下层探索。"
guide_analyze_s4: "在清理前，可逐项核对建议清理的临时文件列表。"
guide_analyze_tip: "提示: 未经您的明确确认，绝不会删除任何文件。"
guide_vault_title: "使用密码保护隐私文件夹"
guide_vault_lead: "锁定文件夹，未经密码授权其内部内容完全加密且不可读取。"
guide_vault_s1: "右键点击您想要保护的目标文件夹。"
guide_vault_s2: "选择“使用密码保护…”并设置安全密码。"
guide_vault_s3: "若要重新打开，右键点击该文件夹并选择“解锁…”。"
guide_vault_s4: "请妥善保管您的密码: 一旦遗失，文件夹数据将无法找回。"
guide_vault_tip: "提示: 您可以指定哪些配置文件可以查看此受保护文件夹。"
guide_tags_title: "使用标签分类整理"
guide_tags_lead: "无论文件分散在何处，打上标签即可在后续集中统一检索。"
guide_tags_s1: "在侧边栏中展开“标签”分组并创建新标签。"
guide_tags_s2: "选择文件并打开标签选择器。输入名称即可创建或快速切换标签。"
guide_tags_s3: "在侧边栏中点击相应标签，即可查看所有带有该标签的文件。"
guide_tags_s4: "在标签右键菜单中可重命名或删除标签。"
guide_tags_tip: "提示: 单个文件可以同时分配多个标签。"
guide_cloud_title: "畅连云存储网盘"
guide_cloud_lead: "如同浏览普通文件夹一样，直接浏览并复制云服务中的文件。"
guide_cloud_s1: "在侧边栏中展开“网络”分组。"
guide_cloud_s2: "选择“添加云盘”并选取您的云服务提供商。"
guide_cloud_s3: "在弹出提示中登录授权。随后该云盘将显示在侧边栏中。"
guide_cloud_s4: "在云端与本地计算机之间拖放文件。传输进度实时显示在传输面板中。"
guide_cloud_tip: "提示: 您的登录凭据仅保存在当前本地计算机上。"
guide_themes_title: "个性化定制 Atlas"
guide_themes_lead: "为每个配置文件单独定制外观主题与文件图标风格。"
guide_themes_s1: "使用下方的快捷键打开“设置”。"
guide_themes_s2: "选择外观主题。各个配置文件均可保留各自的偏好。"
guide_themes_s3: "在命令面板中使用“选择文件图标主题...”更改文件图标样式。"
guide_themes_s4: "使用“下载文件图标主题...”获取更多精美图标包。"
guide_themes_tip: "提示: 您随时可以从命令面板中输入“快速上手指南”重新运行首次配置向导。"
guide_open_link: "打开完整功能指南"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "快速预览 (Quick Look)"
