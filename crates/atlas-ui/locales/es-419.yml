cmd_sys_guide_title: "Guía de funciones"
cmd_sys_guide_desc: "Aprende qué puede hacer Atlas, paso a paso."
guide_title: "Guía de Atlas"
guide_try: "Pruébalo ahora"
guide_shortcut: "Atajo:"
guide_goto_title: "Encontrar algo rápido"
guide_goto_lead: "Salta a cualquier carpeta o archivo escribiendo unas letras de su nombre. Sin ir carpeta por carpeta."
guide_goto_s1: "Abre Goto con el atajo de abajo, o desde el menú de Atlas."
guide_goto_s2: "Escribe parte del nombre. Las letras no tienen que ir juntas."
guide_goto_s3: "Usa las flechas para elegir un resultado y presiona Enter para abrirlo."
guide_goto_s4: "Presiona Esc para cerrarlo sin hacer nada."
guide_goto_tip: "Consejo: también puedes pegar una ruta completa para ir directo."
guide_commands_title: "Hacer cualquier cosa con el teclado"
guide_commands_lead: "La paleta de comandos lista todas las acciones de Atlas. Si no sabes dónde está algo, búscalo aquí."
guide_commands_s1: "Abre la paleta con el atajo de abajo."
guide_commands_s2: "Escribe lo que quieres: \"grid\", \"split\", \"theme\", \"hidden\"."
guide_commands_s3: "Presiona Enter para ejecutarlo. El atajo de cada comando aparece a la derecha."
guide_commands_s4: "En Configuración puedes cambiar el atajo de casi cualquier comando."
guide_commands_tip: "Consejo: es la forma más rápida de aprender Atlas. Recorre la lista una vez."
guide_views_title: "Cambiar cómo se ven los archivos"
guide_views_lead: "Cada panel puede mostrar sus archivos como mejor le venga a la carpeta: fotos en miniaturas, documentos en lista detallada."
guide_views_s1: "Abre la paleta de comandos y escribe \"View\"."
guide_views_s2: "Elige Detalles, Lista, Miniaturas, Columnas (Miller) o Árbol."
guide_views_s3: "Usa \"Group by\" en la paleta para agrupar por fecha, tamaño, tipo y más."
guide_views_s4: "Activa el Inspector para previsualizar el archivo seleccionado junto a la lista."
guide_views_tip: "Consejo: cada carpeta puede recordar su propia vista."
guide_panes_title: "Trabajar en varios sitios a la vez"
guide_panes_lead: "Divide la ventana en paneles y pestañas para comparar carpetas o mover archivos entre ellas."
guide_panes_s1: "Ejecuta \"Split Horizontal\" o \"Split Vertical\" desde la paleta de comandos."
guide_panes_s2: "Abre carpetas en cada panel. Haz clic en un panel para enfocarlo."
guide_panes_s3: "Arrastra archivos de un panel a otro para copiarlos o moverlos."
guide_panes_s4: "Usa las pestañas dentro de un panel para tener más carpetas a mano."
guide_panes_tip: "Consejo: al cerrar un panel, los demás crecen para ocupar el espacio."
guide_convert_title: "Convertir un archivo a otro formato"
guide_convert_lead: "Convierte imágenes, audio, vídeo y documentos a otros formatos sin salir de Atlas."
guide_convert_s1: "Selecciona uno o más archivos."
guide_convert_s2: "Abre Convert con el atajo de abajo, o desde el menú contextual."
guide_convert_s3: "Elige el formato de salida y las opciones."
guide_convert_s4: "Inicia la conversión. El resultado se guarda junto al original."
guide_convert_tip: "Consejo: algunos formatos necesitan un motor opcional, que Atlas te ofrece instalar."
guide_analyze_title: "Ver qué ocupa tu disco"
guide_analyze_lead: "Encuentra las carpetas más grandes y los archivos temporales de una unidad y libera espacio con seguridad."
guide_analyze_s1: "Haz clic derecho en una unidad de la barra lateral."
guide_analyze_s2: "Elige \"Analizar y liberar espacio…\"."
guide_analyze_s3: "Explora el mapa: el área de cada bloque es su tamaño. Doble clic para entrar."
guide_analyze_s4: "Revisa los temporales sugeridos antes de que se elimine nada."
guide_analyze_tip: "Consejo: no se borra nada sin tu revisión."
guide_vault_title: "Proteger una carpeta con contraseña"
guide_vault_lead: "Bloquea una carpeta para que su contenido sea ilegible sin la contraseña."
guide_vault_s1: "Haz clic derecho en la carpeta que quieres proteger."
guide_vault_s2: "Elige \"Proteger con contraseña…\" y define una contraseña."
guide_vault_s3: "Para abrirla de nuevo, clic derecho y \"Desbloquear…\"."
guide_vault_s4: "Guarda bien tu contraseña: si la pierdes, la carpeta no se puede recuperar."
guide_vault_tip: "Consejo: puedes elegir qué perfiles ven la carpeta protegida."
guide_tags_title: "Organizar con etiquetas"
guide_tags_lead: "Las etiquetas marcan archivos estén donde estén, para encontrarlos juntos después."
guide_tags_s1: "En la barra lateral, abre la sección Etiquetas y crea una."
guide_tags_s2: "Selecciona archivos y abre el selector de etiquetas. Escribe un nombre para crear o alternar una."
guide_tags_s3: "Haz clic en una etiqueta de la barra lateral para ver todos los archivos que la tienen."
