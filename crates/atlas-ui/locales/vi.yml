guide_commands_title: "Làm mọi thứ từ bàn phím"
guide_commands_lead: "Bảng lệnh liệt kê mọi thao tác trong Atlas. Nếu không biết tính năng ở đâu, hãy tìm kiếm tại đây."
guide_commands_s1: "Mở bảng lệnh bằng phím tắt bên dưới."
guide_commands_s2: "Gõ điều bạn muốn: \"grid\", \"split\", \"theme\", \"hidden\"."
guide_commands_s3: "Nhấn Enter để chạy lệnh. Phím tắt của mỗi lệnh hiển thị ở bên phải."
guide_commands_s4: "Trong Cài đặt, bạn có thể thay đổi phím tắt của hầu hết mọi lệnh."
guide_commands_tip: "Mẹo: đây là cách nhanh nhất để làm quen với Atlas. Hãy duyệt qua danh sách một lần."
guide_views_title: "Thay đổi cách hiển thị tệp"
guide_views_lead: "Mỗi ngăn có thể hiển thị tệp theo cách phù hợp với thư mục: ảnh dưới dạng hình thu nhỏ, tài liệu dưới dạng danh sách chi tiết."
guide_views_s1: "Mở bảng lệnh và gõ \"View\"."
guide_views_s2: "Chọn Chi tiết, Danh sách, Hình thu nhỏ, Cột (Miller) hoặc Cây thư mục."
guide_views_s3: "Dùng \"Nhóm theo\" trong bảng lệnh để nhóm theo ngày, kích thước, loại và nhiều tiêu chí khác."
guide_views_s4: "Bật/tắt Trình kiểm tra để xem trước tệp đã chọn bên cạnh danh sách."
guide_views_tip: "Mẹo: mỗi thư mục có thể ghi nhớ chế độ xem riêng."
guide_panes_title: "Làm việc tại nhiều nơi cùng lúc"
