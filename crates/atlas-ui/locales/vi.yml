guide_panes_s1: "Chạy \"Tách ngang\" hoặc \"Tách dọc\" từ bảng lệnh."
guide_panes_s2: "Mở thư mục trong từng ngăn. Nhấp vào một ngăn để chuyển tiêu điểm vào đó."
guide_panes_s3: "Kéo tệp từ ngăn này sang ngăn khác để sao chép hoặc di chuyển."
guide_panes_s4: "Sử dụng các thẻ bên trong ngăn để giữ nhiều thư mục trong tầm tay hơn."
guide_panes_tip: "Mẹo: khi đóng một ngăn, các ngăn khác sẽ mở rộng để lấp đầy không gian."
guide_convert_title: "Chuyển đổi tệp sang định dạng khác"
guide_convert_lead: "Chuyển đổi hình ảnh, âm thanh, video và tài liệu sang các định dạng khác mà không cần rời khỏi Atlas."
guide_convert_s1: "Chọn một hoặc nhiều tệp."
guide_convert_s2: "Mở Chuyển đổi bằng phím tắt bên dưới, hoặc từ menu chuột phải."
guide_convert_s3: "Chọn định dạng đầu ra và các tùy chọn."
guide_convert_s4: "Bắt đầu chuyển đổi. Kết quả sẽ được lưu cạnh tệp gốc."
guide_convert_tip: "Mẹo: một số định dạng cần công cụ tùy chọn bổ sung, Atlas sẽ đề xuất cài đặt cho bạn."
guide_analyze_title: "Xem dung lượng đĩa đang được sử dụng"
guide_analyze_lead: "Tìm các thư mục lớn nhất và tệp tạm thời trên ổ đĩa để giải phóng dung lượng an toàn."
guide_analyze_s1: "Nhấp chuột phải vào một ổ đĩa trong thanh bên."
guide_analyze_s2: "Chọn \"Phân tích và giải phóng dung lượng…\"."
guide_analyze_s3: "Khám phá bản đồ: diện tích mỗi khối tương ứng với kích thước của nó. Nhấp đúp để vào sâu hơn."
guide_analyze_s4: "Xem lại các tệp tạm thời được đề xuất trước khi xóa bất kỳ thứ gì."
guide_analyze_tip: "Mẹo: không có gì bị xóa nếu không có sự xem lại của bạn."
guide_vault_title: "Bảo vệ thư mục bằng mật khẩu"
guide_vault_lead: "Khóa thư mục để nội dung bên trong không thể đọc được nếu không có mật khẩu."
guide_vault_s1: "Nhấp chuột phải vào thư mục bạn muốn bảo vệ."
guide_vault_s2: "Chọn \"Bảo vệ bằng mật khẩu…\" và đặt mật khẩu."
guide_vault_s3: "Để mở lại, nhấp chuột phải vào thư mục và chọn \"Mở khóa…\"."
guide_vault_s4: "Giữ mật khẩu an toàn: nếu mất mật khẩu, thư mục không thể khôi phục."
guide_vault_tip: "Mẹo: bạn có thể chọn những hồ sơ nào có thể thấy thư mục được bảo vệ."
guide_tags_title: "Sắp xếp với thẻ"
guide_tags_lead: "Thẻ giúp dán nhãn tệp ở bất kỳ đâu, nhờ đó bạn có thể tìm thấy chúng cùng nhau sau này."
guide_tags_s1: "Trong thanh bên, mở phần Thẻ và tạo một thẻ mới."
guide_tags_s2: "Chọn tệp và mở bộ chọn thẻ. Gõ tên để tạo hoặc chuyển đổi thẻ."
guide_tags_s3: "Nhấp vào một thẻ trong thanh bên để xem mọi tệp có gắn thẻ đó."
guide_tags_s4: "Đổi tên hoặc xóa thẻ từ menu chuột phải của thẻ."
guide_tags_tip: "Mẹo: một tệp có thể gắn nhiều thẻ."
guide_cloud_title: "Sử dụng các ổ đĩa đám mây"
guide_cloud_lead: "Duyệt và sao chép tệp đến và đi từ các dịch vụ đám mây như thể chúng là thư mục cục bộ."
guide_cloud_s1: "Trong thanh bên, mở phần Mạng."
guide_cloud_s2: "Chọn \"Thêm ổ đĩa đám mây\" và chọn nhà cung cấp của bạn."
guide_cloud_s3: "Đăng nhập khi được nhắc. Ổ đĩa sẽ xuất hiện trong thanh bên."
guide_cloud_s4: "Kéo tệp giữa đám mây và máy tính. Tiến trình hiển thị trên thanh truyền tải."
guide_cloud_tip: "Mẹo: thông tin đăng nhập của bạn luôn ở lại trên máy tính này."
guide_themes_title: "Cá nhân hóa Atlas"
guide_themes_lead: "Thay đổi chủ đề giao diện và biểu tượng tệp cho từng hồ sơ."
guide_themes_s1: "Mở Cài đặt bằng phím tắt bên dưới."
guide_themes_s2: "Chọn một chủ đề. Mỗi hồ sơ lưu chủ đề riêng."
guide_themes_s3: "Dùng \"Select Icon Theme…\" trong bảng lệnh để đổi biểu tượng tệp."
guide_themes_s4: "Dùng \"Download Icon Theme…\" để lấy thêm các bộ biểu tượng."
guide_themes_tip: "Mẹo: bạn có thể mở lại thiết lập lần đầu bất kỳ lúc nào từ bảng lệnh: \"Getting Started\"."
guide_open_link: "Mở hướng dẫn tính năng đầy đủ"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Xem nhanh (Quick Look)"
