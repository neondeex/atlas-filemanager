guide_goto_title: "Tìm kiếm nhanh mọi thứ"
guide_goto_lead: "Chuyển đến bất kỳ thư mục hoặc tệp nào bằng cách gõ vài chữ cái trong tên của nó. Không cần nhấp qua từng thư mục."
guide_goto_s1: "Mở Goto bằng phím tắt bên dưới, hoặc từ menu Atlas."
guide_goto_s2: "Gõ một phần tên. Các chữ cái không nhất thiết phải liền nhau."
