guide_goto_title: "Швидкий пошук файлів"
guide_goto_lead: "Переходьте до будь-якої папки чи файлу, просто ввівши кілька літер з назви. Жодних зайвих переходів по папках."
guide_goto_s1: "Відкрийте вікно «Перейти» за допомогою гарячої клавіші нижче або з меню Atlas."
guide_goto_s2: "Введіть частину імені. Літери не обов'язково мають іти поспіль."
guide_goto_s3: "Використовуйте клавіші зі стрілками для вибору результату та натисніть Enter, щоб відкрити його."
guide_goto_s4: "Натисніть Esc, щоб закрити вікно без будь-яких дій."
guide_goto_tip: "Порада: ви також можете вставити повний шлях, щоб перейти безпосередньо туди."
guide_commands_title: "Будь-яка дія з клавіатури"
guide_commands_lead: "Палітра команд містить усі можливі дії в Atlas. Якщо ви не знаєте, де щось розташовано — шукайте тут."
guide_commands_s1: "Відкрийте палітру за допомогою гарячої клавіші нижче."
guide_commands_s2: "Введіть те, що шукаєте: «grid», «split», «theme», «hidden»."
guide_commands_s3: "Натисніть Enter для виконання. Гаряча клавіша кожної команди відображається праворуч."
guide_commands_s4: "У налаштуваннях ви можете змінити комбінацію клавіш майже для будь-якої команди."
guide_commands_tip: "Порада: це найшвидший спосіб освоїти Atlas. Перегляньте список команд хоча б раз."
guide_views_title: "Налаштування вигляду файлів"
guide_views_lead: "Кожна панель може відображати файли у зручний спосіб: фотографії як ескізи, документи як докладний список."
guide_views_s1: "Відкрийте палітру команд і введіть «View»."
guide_views_s2: "Виберіть: Таблиця, Список, Ескізи, Стовпці (Міллера) або Дерево."
guide_views_s3: "Скористайтеся «Групувати за» в палітрі, щоб згрупувати за датою, розміром, типом тощо."
guide_views_s4: "Увімкніть Інспектор, щоб переглядати вибраний файл поруч зі списком."
guide_views_tip: "Порада: кожна папка може зберігати власний режим вигляду."
guide_panes_title: "Робота в кількох місцях одночасно"
guide_panes_lead: "Розділяйте вікно на панелі та вкладки, щоб порівнювати папки або переміщувати файли між ними."
guide_panes_s1: "Виконайте «Розділити горизонтально» або «Розділити вертикально» з палітри команд."
guide_panes_s2: "Відкривайте папки в кожній панелі. Клікніть панель, щоб активувати її."
guide_panes_s3: "Перетягуйте файли з однієї панелі в іншу для копіювання чи переміщення."
guide_panes_s4: "Використовуйте вкладки всередині панелі, щоб тримати під рукою ще більше папок."
guide_panes_tip: "Порада: закрийте панель, і решта панелей розширяться, заповнюючи простір."
guide_convert_title: "Конвертація файлів в інший формат"
guide_convert_lead: "Перетворюйте зображення, аудіо, відео та документи в інші формати, не виходячи з Atlas."
guide_convert_s1: "Виберіть один або кілька файлів."
guide_convert_s2: "Відкрийте Конвертацію за допомогою гарячої клавіші нижче або через контекстне меню."
guide_convert_s3: "Виберіть вихідний формат та параметри."
guide_convert_s4: "Розпочніть конвертацію. Результат збережеться поруч з оригіналом."
guide_convert_tip: "Порада: для деяких форматів потрібен додатковий рушій, який Atlas запропонує встановити."
guide_analyze_title: "Аналіз дискового простору"
guide_analyze_lead: "Знаходьте найбільші папки й тимчасові файли на диску та безпечно звільняйте місце."
guide_analyze_s1: "Клікніть правою кнопкою миші диск на бічній панелі."
guide_analyze_s2: "Виберіть «Аналізувати та звільнити місце…»."
guide_analyze_s3: "Досліджуйте карту: площа кожного блока відображає його розмір. Подвійний клік відкриває папку."
guide_analyze_s4: "Перегляньте запропоновані тимчасові файли перед тим, як будь-що видаляти."
guide_analyze_tip: "Порада: нічого не видаляється без вашої особистої перевірки."
guide_vault_title: "Захист папки паролем"
guide_vault_lead: "Заблокуйте папку, щоб її вміст було неможливо прочитати без пароля."
guide_vault_s1: "Клікніть правою кнопкою миші на папці, яку бажаєте захистити."
guide_vault_s2: "Виберіть «Захистити паролем…» та встановіть надійний пароль."
guide_vault_s3: "Щоб відкрити її знову, клікніть правою кнопкою та виберіть «Розблокувати…»."
guide_vault_s4: "Зберігайте пароль у надійному місці: якщо його втратити, відновити папку буде неможливо."
guide_vault_tip: "Порада: ви можете вибрати, в яких саме профілях буде видно захищену папку."
guide_tags_title: "Організація за допомогою тегів"
guide_tags_lead: "Теги позначають файли, де б вони не зберігалися, дозволяючи знайти їх разом пізніше."
guide_tags_s1: "На бічній панелі відкрийте розділ «Теги» та створіть новий тег."
guide_tags_s2: "Виберіть файли та відкрийте вибір тегів. Введіть назву, щоб створити або призначити тег."
guide_tags_s3: "Клікніть тег на бічній панелі, щоб переглянути всі файли з цим тегом."
guide_tags_s4: "Перейменовуйте або видаляйте теги через їхнє контекстне меню."
guide_tags_tip: "Порада: один файл може мати кілька тегів одночасно."
guide_cloud_title: "Хмарні диски та сховища"
guide_cloud_lead: "Переглядайте та копіюйте файли з хмарних сервісів так само зручно, як і зі звичайних папок."
guide_cloud_s1: "На бічній панелі відкрийте розділ «Мережа»."
guide_cloud_s2: "Виберіть «Додати хмарний диск» та оберіть свого провайдера."
guide_cloud_s3: "Увійдіть в обліковий запис на вимогу. Диск з'явиться на бічній панелі."
guide_cloud_s4: "Перетягуйте файли між хмарою та комп'ютером. Прогрес видно на панелі передавання."
guide_cloud_tip: "Порада: ваші облікові дані залишаються виключно на цьому комп'ютері."
guide_themes_title: "Персоналізація Atlas"
guide_themes_lead: "Змінюйте колірні теми та піктограми файлів індивідуально для кожного профілю."
guide_themes_s1: "Відкрийте налаштування за допомогою комбінації клавіш нижче."
guide_themes_s2: "Виберіть колірну тему. Кожен профіль зберігає власну тему."
guide_themes_s3: "Використайте «Вибрати тему значків…» у палітрі команд, щоб змінити піктограми файлів."
guide_themes_s4: "Використайте «Завантажити тему значків…», щоб отримати додаткові набори піктограм."
guide_themes_tip: "Порада: ви можете знову відкрити початкове налаштування будь-коли через палітру команд: «Початок роботи»."
guide_open_link: "Відкрити повний посібник з функцій"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
