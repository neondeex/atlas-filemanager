guide_title: "Przewodnik po programie Atlas"
guide_try: "Wypróbuj teraz"
guide_shortcut: "Skrót:"
guide_goto_title: "Błyskawiczne wyszukiwanie"
guide_goto_lead: "Przechodź do dowolnego folderu lub pliku, wpisując zaledwie kilka liter nazwy. Bez mozolnego klikania po folderach."
guide_goto_s1: "Otwórz okno „Przejdź do” za pomocą skrótu poniżej lub z menu Atlas."
guide_goto_s2: "Wpisz fragment nazwy. Litery nie muszą występować bezpośrednio obok siebie."
guide_goto_s3: "Użyj klawiszy strzałek, aby wybrać wynik, a następnie naciśnij Enter, aby go otworzyć."
guide_goto_s4: "Naciśnij Esc, aby zamknąć bez wykonywania akcji."
guide_goto_tip: "Wskazówka: możesz również wkleić pełną ścieżkę, aby przejść do niej bezpośrednio."
guide_commands_title: "Wszystko z poziomu klawiatury"
guide_commands_lead: "Paleta poleceń zawiera wszystkie akcje dostępne w programie Atlas. Jeśli nie wiesz, gdzie coś znaleźć, wyszukaj to tutaj."
guide_commands_s1: "Otwórz paletę poleceń za pomocą skrótu poniżej."
guide_commands_s2: "Wpisz to, czego szukasz: „siatka”, „podział”, „motyw”, „ukryte”."
guide_commands_s3: "Naciśnij Enter, aby wykonać polecenie. Skrót dla każdej akcji wyświetlany jest po prawej stronie."
guide_commands_s4: "W Ustawieniach możesz zmienić skrót klawiszowy dla niemal każdego polecenia."
guide_commands_tip: "Wskazówka: to najszybszy sposób na poznanie programu Atlas. Przejrzyj listę przynajmniej raz."
guide_views_title: "Dopasuj sposób wyświetlania plików"
guide_views_lead: "Każde okienko może prezentować pliki w sposób najlepiej pasujący do zawartości: zdjęcia jako miniatury, dokumenty jako listę szczegółową."
guide_views_s1: "Otwórz paletę poleceń i wpisz „Widok”."
guide_views_s2: "Wybierz Szczegóły, Listę, Miniatury, Kolumny (Miller) lub Drzewo."
guide_views_s3: "Użyj opcji „Grupuj według” w palecie, aby pogrupować elementy według daty, rozmiaru, typu i innych kryteriów."
guide_views_s4: "Przełącz Inspektor, aby wyświetlać podgląd zaznaczonego pliku obok listy."
guide_views_tip: "Wskazówka: każdy folder może zapamiętać własny preferowany widok."
guide_panes_title: "Praca w wielu miejscach jednocześnie"
guide_panes_lead: "Podziel okno na panele i karty, aby porównywać foldery lub wygodnie przenosić pliki między nimi."
guide_panes_s1: "Wybierz „Podział poziomy” lub „Podział pionowy” z palety poleceń."
guide_panes_s2: "Otwórz foldery w każdym z okienek. Kliknij okienko, aby przenieść na nie fokus."
guide_panes_s3: "Przeciągaj pliki z jednego okienka do drugiego, aby je skopiować lub przenieść."
guide_panes_s4: "Używaj kart wewnątrz okienka, aby mieć pod ręką jeszcze więcej folderów."
guide_panes_tip: "Wskazówka: po zamknięciu okienka pozostałe panele rozszerzają się, wypełniając przestrzeń."
guide_convert_title: "Konwertuj pliki na inne formaty"
guide_convert_lead: "Zmieniaj formaty obrazów, audio, wideo i dokumentów bez konieczności opuszczania programu Atlas."
guide_convert_s1: "Zaznacz jeden lub więcej plików."
guide_convert_s2: "Otwórz narzędzie konwersji za pomocą skrótu poniżej lub z menu kontekstowego."
guide_convert_s3: "Wybierz format wyjściowy oraz odpowiednie opcje."
guide_convert_s4: "Rozpocznij konwersję. Wynik zostanie zapisany obok pliku oryginalnego."
guide_convert_tip: "Wskazówka: niektóre formaty wymagają opcjonalnego silnika, który Atlas może pomóc zainstalować."
guide_analyze_title: "Sprawdź, co zajmuje Twój dysk"
guide_analyze_lead: "Znajdź największe foldery i pliki tymczasowe na dysku oraz bezpiecznie odzyskaj cenne miejsce."
guide_analyze_s1: "Kliknij prawym przyciskiem myszy dysk na pasku bocznym."
guide_analyze_s2: "Wybierz opcję „Analizuj i zwolnij miejsce…”."
guide_analyze_s3: "Przeglądaj mapę: obszar każdego bloku odpowiada jego rozmiarowi. Kliknij dwukrotnie, aby wejść głębiej."
guide_analyze_s4: "Przejrzyj sugerowane pliki tymczasowe przed ich usunięciem."
guide_analyze_tip: "Wskazówka: nic nie zostanie usunięte bez Twojej weryfikacji i zgody."
guide_vault_title: "Zabezpiecz folder hasłem"
guide_vault_lead: "Zablokuj folder, aby jego zawartość była całkowicie nieczytelna bez podania hasła."
guide_vault_s1: "Kliknij prawym przyciskiem myszy folder, który chcesz zabezpieczyć."
guide_vault_s2: "Wybierz „Zabezpiecz hasłem…” i ustaw bezpieczne hasło."
guide_vault_s3: "Aby otworzyć go ponownie, kliknij prawym przyciskiem myszy i wybierz „Odblokuj…”."
guide_vault_s4: "Dbaj o bezpieczeństwo hasła: w przypadku jego utraty zawartości folderu nie da się odzyskać."
guide_vault_tip: "Wskazówka: możesz wybrać, które profile użytkownika widzą zabezpieczony folder."
guide_tags_title: "Organizuj pliki za pomocą tagów"
guide_tags_lead: "Tagi oznaczają pliki niezależnie od ich położenia, ułatwiając ich późniejsze odnalezienie w jednym miejscu."
guide_tags_s1: "Na pasku bocznym otwórz sekcję Tagi i utwórz nowy tag."
guide_tags_s2: "Zaznacz pliki i otwórz selektor tagów. Wpisz nazwę, aby utworzyć lub przypisać tag."
guide_tags_s3: "Kliknij tag na pasku bocznym, aby wyświetlić wszystkie oznaczone nim pliki."
guide_tags_s4: "Zmieniaj nazwy lub usuwaj tagi z poziomu menu podręcznego."
guide_tags_tip: "Wskazówka: jeden plik może mieć przypisanych wiele różnych tagów."
guide_cloud_title: "Korzystaj z dysków w chmurze"
guide_cloud_lead: "Przeglądaj i kopiuj pliki do oraz z usług w chmurze tak samo wygodnie jak ze zwykłych folderów."
guide_cloud_s1: "Na pasku bocznym otwórz sekcję Sieć."
guide_cloud_s2: "Wybierz „Dodaj dysk w chmurze” i wskaż swojego dostawcę."
guide_cloud_s3: "Zaloguj się po wyświetleniu monitu. Dysk pojawi się na pasku bocznym."
guide_cloud_s4: "Przeciągaj pliki między chmurą a komputerem. Postęp widoczny jest na pasku transferów."
guide_cloud_tip: "Wskazówka: Twoje dane uwierzytelniające pozostają wyłącznie na tym komputerze."
guide_themes_title: "Dopasuj program Atlas do siebie"
guide_themes_lead: "Zmieniaj motyw kolorystyczny i ikony plików osobno dla każdego profilu."
guide_themes_s1: "Otwórz Ustawienia za pomocą poniższego skrótu."
guide_themes_s2: "Wybierz motyw. Każdy profil zachowuje własną konfigurację."
guide_themes_s3: "Użyj polecenia „Wybierz motyw ikon...” w palecie, aby zmienić ikony plików."
guide_themes_s4: "Użyj polecenia „Pobierz motyw ikon...”, aby pobrać nowe zestawy ikon."
guide_themes_tip: "Wskazówka: możesz ponownie otworzyć kreator powitalny w każdej chwili z palety: „Wprowadzenie”."
guide_open_link: "Otwórz pełny przewodnik po funkcjach"

vault_driver_external_instructions: "Atlas downloads the official installer and verifies its integrity. Approve the Windows installation prompt; Atlas then retries opening the folder automatically."
cmd_quick_look_title: "Szybki podgląd (Quick Look)"
