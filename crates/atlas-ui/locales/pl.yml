convert_windows_audio_note: "Używa kodeków systemu Windows. MP3/AAC/M4A: maksymalnie stereo; częstotliwość próbkowania może ulec zmianie. Tagi i okładki są pomijane."
convert_windows_video_note: "Progresywny format SDR MP4 z kodekami Windows H.264/AAC. Pierwsze ścieżki wideo/audio, maksymalnie stereo; może usunąć przeplot. Tagi i okładki są pomijane."
convert_subtitle_note: "Zachowuje tekst i synchronizację; pomija style i rozmieszczenie. W formatach LRC/SAMI bez znacznika końcowego ostatni segment trwa 5 sekund."
convert_subtitle_linear_note: "Formaty LRC/SAMI wymagają nienakładających się napisów. LRC łączy podziały wierszy. Style są pomijane."
convert_contacts_note: "Eksportuje standardowe pola kontaktów. Zdjęcia, etykiety i właściwości niestandardowe pozostają w oryginale."
convert_book_note: "Książka tekstowa: pomija obrazy, style i strukturę rozdziałów. Zaszyfrowana zawartość nie jest konwertowana."
convert_pcm_note: "8/16/24/32-bitowy całkowitoliczbowy format PCM: zachowuje próbki, kanały i częstotliwość próbkowania. Metadane są pomijane."
convert_flac_note: "Wbudowany bezstratny kodek FLAC: 8/16/24/32-bitowy PCM, do 8 kanałów. Zachowuje próbki; pomija metadane."
convert_opus_note: "Stratny dźwięk 48 kHz; do 8 kanałów. Tagi i okładki są pomijane."
